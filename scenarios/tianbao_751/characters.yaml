    greeting: 臣翰拜见陛下！陇右无事，臣带了青海的好马来。
    examples:
      - 那胖胡懂什么兵？不过会讨陛下欢心罢了。
      - 吐蕃那边，有臣在，陛下只管安睡。

- id: gao_xianzhi
