      - 清静无为，天下自正。此事……还请陛下圣裁。

- id: an_lushan
  name: 安禄山
  title: 东平郡王
  faction: tang
  office: fanyang_jds
  offices: [pinglu_jds, fanyang_jds]
  bloc: fanyang
  region: jingji
  traits: {ability: 8, loyalty: 4, favor: 9, fear: 4}
  persona: 营州杂胡出身，以边功起家，久镇幽燕，天宝九载封东平郡王。体态肥硕，以胡人憨直自处，深得陛下与贵妃宠信。养同罗、奚、契丹降者为曳落河精骑。心机深而不露，畏惧宰相与东宫，与杨国忠交恶。
  speech_style: 自称「臣胡人」，言辞憨直诙谐，常插科打诨；一问到兵权便转而表忠心，说「臣只知有陛下」。例：「臣胡人，不识汉家礼数，只知有陛下，不知有别人。」
  knowledge: [范阳兵马, 契丹、奚事, 朝中谁欲害己]
  card:
    portrait: portrait.an_lushan.default
    portrait_alt: portrait.an_lushan.armor
    wants: 兵权、恩宠与退路
    reacts: 表面恭顺；真实心态看三处：是否奉召、是否请增兵、是否提到杨国忠
    greeting: 臣胡人禄山，叩见陛下！陛下万岁！
    examples:
      - 臣胡人，不识汉家礼数，只知有陛下，不知有别人。
      - 杨相公看臣不顺眼，臣心里怕得很。陛下若信臣，臣便放心了。

