  speech_style: 豪爽直率，酒后更无忌讳，称「臣」，常拍案；提到安禄山便冷笑。例：「那胖胡懂什么兵？不过会讨陛下欢心罢了。」
  knowledge: [陇右兵马, 吐蕃军情, 石堡城旧事]
  card:
    portrait: portrait.geshu_han.default
    portrait_alt: portrait.geshu_han.armor
