- id: t2_shuofang
  turn: 2
  title: 朔方留后人选
  summary: 李林甫遥领朔方，意欲辞去，属意河西节度使安思顺兼领。朔方军将郭子仪、河西副使李光弼皆有能名。
  region: shuofang
  advisors:
