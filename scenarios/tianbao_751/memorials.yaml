# 奏疏条目（CONTRACT §1.10）。T0–T3 为教程脚本；此后每季至少三条，另有按条件出现的史事环节与常设条目。
# 次序约定：凡奏疏所问之事，相关事件一律在其后一季（或由选项直接执行），不得先于奏疏发生。
# memory: {character, text} 为该选项写入人物记忆（引擎支持后生效）。
# 采纳某选项即把其 ops 加入诏书草案；确认后写入 flag memorial:<id> = option_id。
# 文本为本游戏写作（【虚】）；涉及史事处以 docs/FACT_CHECK.md 为准。hint 中「异志（风闻）」指隐藏数值。

# ============================== T0 天宝十载春（序章） ==============================
- id: t0_hedong
  turn: 0
  title: 河东节度出缺
  summary: 河东节度使出缺。安禄山请兼领，并荐吉温为节度副使、知留后。若不处置，下季制书照例施行。
  region: hedong
  illustration: event.hedong_grant
  advisors:
    - {character: li_linfu, stance: support, line: 陛下圣明。蕃将无党援，专任之，边事可无忧。}
    - {character: gao_lishi, stance: neutral, line: 圣意所在，老奴不敢多言。}
    - {character: yang_guozhong, stance: oppose, line: 三镇之兵近二十万，尽付一胡，臣以为不可。}
  options:
    - id: deny
      label: 驳回，另择留后，并厚赐金帛
      memory: {character: an_lushan, text: 天宝十载春，求兼河东节度，陛下不许，另赐金帛}
      ops:
        - {op: set_flag, key: hedong_denied, value: true}
        - {op: adjust_resource, resource: fanzhen_power, delta: -3, reason: 河东别授}
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 厚赐禄山}
        - {op: adjust_resource, resource: an_ambition, delta: -2, reason: 恩赐以安其心}
      hint: 外重内轻 −3，国库 −60，异志（风闻）↓
    - id: grant_watch
      label: 准兼河东，副使改由朝廷简派
      memory: {character: an_lushan, text: 天宝十载春，陛下许我兼领河东，副使却由朝廷简派}
      ops:
        - {op: appoint, character: an_lushan, office: hedong_jds}
        - {op: set_army_commander, army: hedong_army, character: an_lushan}
        - {op: adjust_resource, resource: fanzhen_power, delta: 5, reason: 禄山兼三镇}
        - {op: adjust_resource, resource: an_ambition, delta: 2, reason: 副使非其人}
        - {op: set_flag, key: hedong_to_an, value: true}
        - {op: set_flag, key: hedong_secured, value: true}
      hint: 外重内轻 +5；乱时太原或可拒命
    - id: grant
      label: 照准，并赐铁券
      memory: {character: an_lushan, text: 天宝十载春，陛下许我兼领河东，并赐铁券}
      ops:
        - {op: appoint, character: an_lushan, office: hedong_jds}
        - {op: set_army_commander, army: hedong_army, character: an_lushan}
        - {op: adjust_resource, resource: fanzhen_power, delta: 8, reason: 安禄山兼领三镇}
        - {op: adjust_resource, resource: an_ambition, delta: 3, reason: 兵权日重}
        - {op: set_flag, key: hedong_to_an, value: true}
      hint: 外重内轻 +8（史事）

- id: t0_xier
  turn: 0
  title: 禄山生辰
  summary: 安禄山生辰，陛下与贵妃赐衣物、宝器。贵妃欲于宫中行「洗儿」之戏，禄山出入禁中，外议颇多。
  region: jingji
  illustration: event.xi_er
  advisors:
    - {character: yang_guozhong, stance: support, line: 厚赐以示恩宠，范阳必感激图报。}
    - {character: yan_zhenqing, stance: oppose, line: 礼者，所以别嫌明微。边将出入宫掖，非礼也。}
    - {character: yang_guifei, stance: support, line: 不过一场玩笑，三郎何必当真？}
  options:
    - id: modest
      label: 依常例赏赐，禁中出入有节
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 生辰赏赐}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 宫禁有度}
      hint: 国库 −30，君威 +1
    - id: lavish
      label: 厚赐，并许其出入宫禁
      memory: {character: an_lushan, text: 生辰之日，陛下与贵妃厚赐，许我出入宫禁}
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 厚赐}
        - {op: adjust_resource, resource: corruption, delta: 2, reason: 宫禁不严}
        - {op: adjust_resource, resource: court_strife, delta: 3, reason: 外议纷纷}
        - {op: adjust_resource, resource: an_ambition, delta: -2, reason: 恩宠}
      hint: 国库 −80，积弊 +2，朝争 +3，异志（风闻）↓
    - id: rites
      label: 从颜真卿之议，罢洗儿之戏
      memory: {character: an_lushan, text: 生辰之日，颜真卿进言，罢了洗儿之戏}
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 守礼}
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 恩意稍薄}
        - {op: adjust_trait, character: yang_guifei, trait: favor, delta: -1}
      hint: 君威 +2，异志（风闻）↑

- id: t0_nanzhao
  turn: 0
  title: 南诏陷姚州
  summary: 云南太守张虔陀侮慢南诏王阁罗凤，南诏怒而攻陷云南郡。剑南节度使鲜于仲通请发兵八万讨之。
  region: jiannan
  advisors:
    - {character: yang_guozhong, stance: support, line: 蛮夷犯顺，不讨无以示威。仲通一出，指日可平。}
    - {character: gao_xianzhi, stance: oppose, line: 西南山险瘴深，不宜深入。}
    - {character: xianyu_zhongtong, stance: support, line: 南诏小蛮，臣发兵一举可平。}
  options:
    - id: appease
      label: 查办张虔陀之过，许南诏谢罪
      memory: {character: xianyu_zhongtong, text: 请讨南诏，陛下不许，反查办张虔陀}
      ops:
        - {op: set_flag, key: nanzhao_appeased, value: true}
        - {op: adjust_resource, resource: frontier_pressure, delta: -2, reason: 西南罢兵}
        - {op: adjust_resource, resource: court_strife, delta: 1, reason: 国忠不悦}
      hint: 边患 −2，朝争 +1；免西洱河之败
    - id: campaign
      label: 准仲通所请，发兵讨之
      ops:
        - {op: set_flag, key: nanzhao_campaign, value: true}
        - {op: adjust_resource, resource: treasury, delta: -100, reason: 南征军费}
      hint: 国库 −100；南征（史事）

- id: t0_anxi
  turn: 0
  title: 高仙芝献俘
  summary: 高仙芝入朝献俘。朝议欲以仙芝代安思顺镇河西，河西诸胡割耳剺面请留思顺。仙芝又请再讨石国余党。
  region: anxi
  advisors:
    - {character: li_linfu, stance: neutral, line: 诸胡之心可用，臣以为宜留思顺。}
    - {character: gao_xianzhi, stance: support, line: 石国余党投大食，不早除，后患不小。}
    - {character: geshu_han, stance: oppose, line: 西陲已苦战数年，士卒当歇一歇了。}
  options:
    - id: restrain
      label: 留思顺于河西，命仙芝不得擅启边衅
      ops:
        - {op: set_flag, key: anxi_restrained, value: true}
        - {op: adjust_resource, resource: frontier_pressure, delta: 1, reason: 西域小警}
      hint: 边患 +1；免怛罗斯之败
    - id: campaign
      label: 准仙芝讨石国余党
      ops:
        - {op: set_flag, key: anxi_deep_campaign, value: true}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 西征军费}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 远略}
      hint: 国库 −40，君威 +1；深入（史事）

- id: t0_huaqing
  turn: 0
  title: 府库充盈
  summary: 度支奏左藏、太仓充盈，岁入有余，请修缮华清宫以备冬幸。
  region: jingji
  advisors:
    - {character: yang_guozhong, stance: support, line: 今岁所入，较往岁又增，皆陛下洪福。修宫室正当其时。}
    - {character: gao_lishi, stance: oppose, line: 老奴斗胆：宿卫诸军，久不操练了。}
    - {character: chen_xilie, stance: neutral, line: 右相与度支所言皆是，臣无异议。}
  options:
    - id: train
      label: 拨款整训京畿禁军
      ops:
        - op: start_project
          name: 禁军整训
          region: jingji
          cost_per_turn: {treasury: 60}
          turns: 4
          on_complete:
            - {op: adjust_army, army: jinjun, delta: 10000, reason: 禁军整训}
            - {op: adjust_region, region: jingji, stat: defense, delta: 10}
            - {op: adjust_resource, resource: fanzhen_power, delta: -4, reason: 内重稍复}
      hint: 每季 −60 共四季；成后禁军 +1万、京畿防务 +10、外重内轻 −4
    - id: palace
      label: 营建华清宫
      ops:
        - {op: adjust_resource, resource: treasury, delta: -100, reason: 营建宫室}
        - {op: adjust_resource, resource: corruption, delta: 3, reason: 工役侵渔}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 盛世气象}
      hint: 国库 −100，积弊 +3，君威 +1
    - id: remit
      label: 减免关辅租调
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 蠲免}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 宽民力}
      hint: 国库 −80，民心 +3

# ============================== T1 天宝十载夏 ==============================
- id: t1_xier_report
  conditions:
    all:
      - {kind: turn, operator: eq, value: 1}
      - {kind: flag, operator: eq, key: xier_defeat, value: true}
  title: 西洱河败报
  summary: 西洱河败报至。杨国忠为鲜于仲通叙功，请于两京及河南、河北分道募兵，再征南诏。
  region: jiannan
  illustration: event.xier_defeat
  advisors:
    - {character: yang_guozhong, stance: support, line: 小挫而已，臣已筹得军资，再发兵数万，必雪此耻。}
    - {character: yan_zhenqing, stance: oppose, line: 六万之众，一朝覆没，而以功闻，欺天也。}
    - {character: gao_lishi, stance: neutral, line: 老奴听说，募兵的道上，哭声不绝。}
  options:
    - id: peace
      label: 追究败责，罢兵议和
      memory: {character: yang_guozhong, text: 西洱河败后，陛下追究败责，罢兵议和}
      ops:
        - {op: set_flag, key: nanzhao_peace, value: true}
        - {op: adjust_resource, resource: frontier_pressure, delta: -3, reason: 罢兵}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 赏罚分明}
        - {op: adjust_resource, resource: court_strife, delta: 3, reason: 国忠衔恨}
      hint: 边患 −3，君威 +1，朝争 +3；免后续南征
    - id: conscript
      label: 准分道募兵，再图南诏
      ops:
        - {op: adjust_resource, resource: morale, delta: -5, reason: 强征}
        - {op: adjust_resource, resource: corruption, delta: 3, reason: 募兵扰民}
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 募兵}
        - {op: adjust_army, army: jiannan_army, delta: 15000, reason: 分道募兵}
      hint: 民心 −5，积弊 +3，国库 −80（史事）

- id: t1_nanzhao_envoy
  conditions:
    all:
      - {kind: turn, operator: eq, value: 1}
      - {kind: flag, operator: eq, key: nanzhao_appeased, value: true}
  title: 南诏使至
  summary: 南诏遣使入朝谢罪，请还所掠人口，复修职贡。
  region: jiannan
  advisors:
    - {character: li_linfu, stance: neutral, line: 蛮夷畏威怀德，陛下厚待之可也。}
    - {character: yang_guozhong, stance: oppose, line: 示弱于蛮夷，恐吐蕃笑我。}
  options:
    - id: honor
      label: 厚礼回赐，册其王
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 回赐}
        - {op: adjust_resource, resource: frontier_pressure, delta: -2, reason: 南诏归心}
        - {op: set_flag, key: nanzhao_peace, value: true}
      hint: 国库 −40，边患 −2
    - id: cold
      label: 受其贡而薄其赐
      ops:
        - {op: adjust_resource, resource: authority, delta: 1, reason: 天朝体面}
        - {op: adjust_resource, resource: frontier_pressure, delta: 1, reason: 南诏失望}
      hint: 君威 +1，边患 +1

- id: t1_khitan
  turn: 1
  title: 禄山请讨契丹
  summary: 安禄山奏请发平卢、范阳、河东三道兵讨契丹，并请调河东兵马出境助战。
  region: fanyang
  advisors:
    - {character: li_linfu, stance: support, line: 边将请战，忠勇可嘉，臣以为可许。}
    - {character: geshu_han, stance: oppose, line: 那胖胡要借讨契丹之名，把河东兵也攥在手里。}
    - {character: gao_lishi, stance: neutral, line: 老奴只记得，契丹去岁并不曾犯边。}
  options:
    - id: forbid
      label: 不许河东兵出境，令其固守
      memory: {character: an_lushan, text: 请发三道兵讨契丹，朝廷不许河东兵出境}
      ops:
        - {op: set_flag, key: an_forbidden_khitan, value: true}
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 所请不遂}
        - {op: adjust_resource, resource: frontier_pressure, delta: 2, reason: 契丹未受惩}
      hint: 异志（风闻）↑，边患 +2；范阳兵不受损
    - id: approve
      label: 准其所请
      ops:
        - {op: adjust_resource, resource: fanzhen_power, delta: 1, reason: 三道兵并出}
        - {op: adjust_resource, resource: grain, delta: -60, reason: 军粮}
      hint: 外重内轻 +1，太仓 −60；胜负未卜（史事）

- id: t1_grain
  turn: 1
  title: 关中夏粮不足
  summary: 关中夏收不丰，京师仰给江淮漕米，而漕船待发，太仓支用渐紧。
  region: henan
  advisors:
    - {character: yang_guozhong, stance: support, line: 江淮加运，一季可得百余万石，臣督办即是。}
    - {character: yan_zhenqing, stance: oppose, line: 加运则扰民，不如修汴渠以为久计。}
  options:
    - id: canal
      label: 修治汴渠漕路
      ops:
        - op: start_project
          name: 修治汴渠
          region: henan
          cost_per_turn: {treasury: 40}
          turns: 3
          on_complete:
            - {op: adjust_region, region: henan, stat: grain, delta: 4}
            - {op: adjust_region, region: duji, stat: grain, delta: 3}
      hint: 每季 −40 共三季；成后每季粮入 +7
    - id: buy
      label: 关中和籴
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 和籴}
        - {op: adjust_resource, resource: grain, delta: 120, reason: 和籴入仓}
      hint: 国库 −80，太仓 +120
    - id: extra_haul
      label: 令江淮加运
      ops:
        - {op: adjust_resource, resource: grain, delta: 150, reason: 加运}
        - {op: adjust_resource, resource: morale, delta: -2, reason: 江淮劳役}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 转运侵渔}
      hint: 太仓 +150，民心 −2，积弊 +1

- id: t1_donggong
  turn: 1
  title: 东宫属官交结边将
  summary: 中书奏东宫属官与边将书信往还，请付御史台推按。太子上表待罪。（本游戏仿韦坚案设）
  region: jingji
  advisors:
    - {character: li_linfu, stance: support, line: 臣不敢言东宫有过，然属官交结边将，不可不问。}
    - {character: li_heng, stance: neutral, line: 儿臣管束不严，请父皇责罚。}
    - {character: gao_lishi, stance: oppose, line: 老奴斗胆：太子仁孝，此事恐有人构之。}
  options:
    - id: protect
      label: 庇护东宫，交大理寺复核
      memory: {character: li_heng, text: 东宫属官被告交结边将，父皇庇护儿臣，交大理寺复核}
      ops:
        - {op: adjust_trait, character: li_heng, trait: loyalty, delta: 1}
        - {op: adjust_resource, resource: court_strife, delta: 2, reason: 右相不悦}
        - {op: set_flag, key: donggong_protected, value: true}
      hint: 太子忠诚 +1，朝争 +2；此后东宫不再被构
    - id: allow
      label: 听右相推按
      memory: {character: li_heng, text: 东宫属官被告交结边将，父皇听凭右相推按}
      ops:
        - {op: adjust_resource, resource: court_strife, delta: 5, reason: 大狱复兴}
        - {op: adjust_trait, character: li_heng, trait: loyalty, delta: -1}
        - {op: set_flag, key: donggong_isolated, value: true}
      hint: 朝争 +5，太子离心

# ============================== T2 天宝十载秋 ==============================
- id: t2_west
  conditions:
    all:
      - {kind: turn, operator: eq, value: 2}
      - {kind: flag, operator: eq, key: talas_defeat, value: true}
  title: 怛罗斯败报
  summary: 高仙芝与大食战于怛罗斯，葛逻禄倒戈，蕃汉兵三万所存无几。仙芝请再发兵以雪前耻。
  region: anxi
  illustration: event.talas
  advisors:
    - {character: gao_xianzhi, stance: support, line: 败在葛逻禄反复，非战之罪。再给臣兵，可复此仇。}
    - {character: feng_changqing, stance: oppose, line: 四镇存粮不支一冬，再征则安西自乱。}
  options:
    - id: hold
      label: 稳守四镇，安抚葛逻禄
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 抚慰诸部}
        - {op: adjust_resource, resource: frontier_pressure, delta: -3, reason: 西域稍安}
      hint: 国库 −40，边患 −3
    - id: avenge
      label: 再发西域兵
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 西征}
        - {op: adjust_army, army: anxi_army, delta: 6000, reason: 补募}
        - {op: adjust_resource, resource: morale, delta: -2, reason: 远戍}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 不示弱}
      hint: 国库 −80，安西兵 +6000，民心 −2
    - id: replace
      label: 留仙芝宿卫，以封常清知安西
      memory: {character: gao_xianzhi, text: 怛罗斯败后，陛下留臣宿卫，以常清代镇安西}
      ops:
        - {op: dismiss, character: gao_xianzhi, office: anxi_jds}
        - {op: appoint, character: feng_changqing, office: anxi_jds}
        - {op: set_army_commander, army: anxi_army, character: feng_changqing}
        - {op: adjust_resource, resource: frontier_pressure, delta: -2, reason: 务实守边}
      hint: 边患 −2；封常清得用

- id: t2_west_calm
  conditions:
    all:
      - {kind: turn, operator: eq, value: 2}
      - {kind: flag, operator: eq, key: anxi_restrained, value: true}
  title: 西域安堵
  summary: 安西奏西域诸国朝贡不绝，大食未至葱岭以东。仙芝在京宿卫，四镇由判官封常清知留后。
  region: anxi
  advisors:
    - {character: feng_changqing, stance: support, line: 四镇无事，臣请以余粮屯田。}
    - {character: gao_xianzhi, stance: oppose, line: 臣在京师闲着，骨头都要生锈了。}
  options:
    - id: farm
      label: 准安西屯田
