        - {op: adjust_resource, resource: an_ambition, delta: 2, reason: 以子为质}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 婚礼}
      hint: 鼙鼓 −2，国库 −30，异志（风闻）↑

- id: t17_qingzong_near
  conditions:
