  advisors:
    - {character: yan_zhenqing, stance: support, line: 臣兄杲卿，忠义出于天性，可托以心腹之事。}
    - {character: gao_lishi, stance: neutral, line: 此事须机密，经老奴之手便是。}
  options:
    - id: contact
      label: 遣密使通问颜杲卿
      memory: {character: yan_gaoqing, text: 陛下遣密使通问，托臣以范阳之事}
      ops:
        - {op: set_flag, key: gaoqing_contacted, value: true}
        - {op: set_flag, key: "intel:an_ambition", value: true}
        - {op: set_flag, key: "intel:rebellion_risk", value: true}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 密使}
      hint: 「禄山异志」风闻区间减半；乱起时常山必应
    - id: decline
      label: 不必，以免打草惊蛇
      ops:
        - {op: adjust_resource, resource: an_ambition, delta: -1, reason: 未起疑}
      hint: 异志（风闻）微降

- id: p_envoy
  conditions:
    all:
      - {kind: turn, operator: gte, value: 4}
      - {not: {kind: flag, operator: eq, key: envoy_sent, value: true}}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  title: 遣使察看范阳
  summary: 朝中言禄山者日多。可遣中使以赐物为名，往察范阳兵马虚实。吏治积弊重时，中使或为所赂。
  region: fanyang
  advisors:
    - {character: yang_guozhong, stance: support, line: 遣人一看便知，臣早说过他必反。}
    - {character: bian_lingcheng, stance: support, line: 奴婢愿往，必替大家看个明白。}
    - {character: yan_zhenqing, stance: neutral, line: 所遣非人，所见亦非实。请先清吏治。}
  options:
    - id: eunuch
      label: 遣中使以赐物为名往察
      ops:
        - {op: set_flag, key: envoy_sent, value: true}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 赐物}
      hint: 积弊 < 50 时可得实情（风闻区间减半）；否则中使或受贿
    - id: censor
      label: 遣御史持节宣慰
      memory: {character: an_lushan, text: 朝廷遣御史持节来范阳察看}
      ops:
        - {op: set_flag, key: envoy_sent, value: true}
        - {op: adjust_resource, resource: corruption, delta: -2, reason: 御史清望}
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 受察而疑}
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 宣慰}
      hint: 积弊 −2，异志（风闻）↑

- id: p_restrain_guozhong
  conditions:
    all:
      - {kind: flag, operator: eq, key: guozhong_in_power, value: true}
      - {not: {kind: flag, operator: eq, key: guozhong_restrained, value: true}}
      - {kind: character_status, operator: eq, character: yang_guozhong, value: alive}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  title: 将相交恶
  summary: 右相杨国忠屡言禄山必反，欲激之以验其言。禄山亦上表诉国忠。将相不和，中外忧之。
  region: jingji
  advisors:
    - {character: yang_guozhong, stance: oppose, line: 臣句句是为陛下！禄山不除，必为后患。}
    - {character: gao_lishi, stance: support, line: 老奴斗胆：两虎相斗，伤的是陛下。}
    - {character: yang_guifei, stance: neutral, line: 阿兄性子急，陛下好好说他便是。}
  options:
    - id: restrain
      label: 约束国忠，不许擅逼范阳
      memory: {character: yang_guozhong, text: 陛下约束臣，不许擅逼范阳}
      ops:
        - {op: set_flag, key: guozhong_restrained, value: true}
        - {op: adjust_resource, resource: court_strife, delta: -5, reason: 将相暂安}
        - {op: adjust_resource, resource: an_ambition, delta: -2, reason: 朝中无人相逼}
        - {op: adjust_trait, character: yang_guozhong, trait: favor, delta: -1}
      hint: 朝争 −5，异志（风闻）↓；免京兆围宅
    - id: dismiss
      label: 罢国忠相位
      memory: {character: yang_guozhong, text: 陛下罢臣相位}
      ops:
        - {op: dismiss, character: yang_guozhong, office: you_xiang}
        - {op: set_flag, key: guozhong_restrained, value: true}
        - {op: set_flag, key: guozhong_in_power, value: false}
        - {op: adjust_resource, resource: court_strife, delta: 4, reason: 外戚失势}
        - {op: adjust_resource, resource: authority, delta: 3, reason: 乾纲独断}
        - {op: adjust_resource, resource: an_ambition, delta: -5, reason: 宿敌去位}
        - {op: adjust_trait, character: yang_guifei, trait: favor, delta: -2}
      hint: 朝争 +4，君威 +3，异志（风闻）大降；右相出缺

- id: p_summon
  conditions:
    all:
      - {kind: turn, operator: gte, value: 14}
