  turn: 1
  conditions:
    all:
      - {not: {kind: flag, operator: exists, key: "memorial:t1_khitan_deputy"}}   # 同题分支：已处理其一则不再出现
      - {not: {kind: flag, operator: eq, key: an_detained, value: true}}   # 禄山已留京解镇者见 t1_khitan_deputy
  title: 禄山请讨契丹
  summary: 安禄山奏请发平卢、范阳、河东三道兵讨契丹，并请调河东兵马出境助战。
  region: fanyang
  illustration: event.fanyang_armoury
  advisors:
    - {character: li_linfu, stance: support, line: 边将请战，忠勇可嘉，臣以为可许。, requires: {office: you_xiang}, option: approve}
    - {character: geshu_han, stance: oppose, line: 那胖胡要借讨契丹之名，把河东兵也攥在手里。, option: forbid}
    - {character: gao_lishi, stance: neutral, line: 老奴只记得，契丹去岁并不曾犯边。, option: forbid}
  proposal: approve
  options:
    - id: forbid
      label: 不许河东兵出境，令其固守
