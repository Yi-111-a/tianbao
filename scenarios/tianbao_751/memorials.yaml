- id: p_fanyang_warn
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_detained, value: true}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  title: 范阳旧部可虑
  keywords: [史思明, 范阳旧部, 兵变, 欠饷, 赦免]
  summary: >-
    禄山既留京师，范阳诸将多出其门下，史思明素得军心。若旧部疑惧，恐推思明为帅、鼓噪拒命。
    兵变之险（逐季明示）：留京之后宽限一季，本季与下季结算皆不发，可从容行策；此后若禄山异志风闻偏高（约 55 以上），每季结算掷一次——
    无策（或穷治之后策数 ≤ 0）约 35%，一策约 20%，二策约 8%，三策以上不发。未经召见而夺镇者（「诸镇自危」），宽限之后另有两季每季约 15%，不论几策。可行之策：新帅到镇（自动计入）、清偿欠饷、赦免旧部、移河东军屯河北弹压；
    穷治党与反减一策。未满三策时，旧部不安，渔阳鼙鼓每季 +2。
    新帅到镇且满三策，则旧部归心：禄山兵柄归零，危机计不再计其异志，渔阳鼙鼓逐季消退（约每季 −1.5）。
  region: fanyang
  illustration: event.fanyang_armoury
  advisors:
    - {character: gao_lishi, stance: support, line: 拔了树根，枝叶还在。范阳那些将官，得先安住了。, option: all_three}
    - {character: yang_guozhong, stance: oppose, line: 胡将尽是禄山死党，安抚何用？当一网打尽！, option: purge}
  proposal: all_three
  options:
    - id: all_three
      label: 三策并行：清偿欠饷、下诏不问旧部、移河东军屯河北
      ops:
        - {op: adjust_resource, resource: treasury, delta: -200, reason: 清偿范阳欠饷、赐物}
        - {op: move_army, army: hedong_army, to_region: hebei}
        - {op: adjust_counter, key: fanyang_measures, delta: 3}
        - {op: set_flag, key: fanyang_paid, value: true}
        - {op: set_flag, key: fanyang_amnesty, value: true}
        - {op: adjust_resource, resource: an_ambition, delta: -2, reason: 旧部得安}
      hint: 国库 −200，河东军移屯河北（行程按实际路线计）；安抚之策 +3（满三策：此后每季兵变之险 0%；新帅到镇后旧部归心，禄山兵柄归零）
    - id: pay_amnesty
      label: 清偿欠饷，下诏不问旧部
      ops:
        - {op: adjust_resource, resource: treasury, delta: -160, reason: 清偿范阳欠饷、赐物}
        - {op: adjust_counter, key: fanyang_measures, delta: 2}
        - {op: set_flag, key: fanyang_paid, value: true}
        - {op: set_flag, key: fanyang_amnesty, value: true}
        - {op: adjust_resource, resource: an_ambition, delta: -1, reason: 旧部得安}
      hint: 国库 −160；安抚之策 +2（新帅未到镇时共 2 策，每季兵变之险约 8%；新帅到镇后满 3 策，0%，旧部归心）
    - id: amnesty
      label: 只下诏不问旧部，加史思明以下官阶
      ops:
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 赐物}
        - {op: adjust_counter, key: fanyang_measures, delta: 1}
        - {op: set_flag, key: fanyang_amnesty, value: true}
      hint: 国库 −40；安抚之策 +1（不足三策：新帅未到镇时每季兵变之险约 20%，到镇后约 8%；旧部仍不安）
    - id: purge
      label: 穷治禄山党与
      memory: {character: shi_siming, text: 主帅留京之后，朝廷穷治范阳党与}
      ops:
        - {op: adjust_counter, key: fanyang_measures, delta: -1}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 威断}
        - {op: adjust_resource, resource: an_ambition, delta: 2, reason: 党与被治}
      hint: 君威 +1；安抚之策 −1（旧部疑惧：策数 ≤ 0 时每季兵变之险约 35%，旧部难以归心）

# 留京宿卫而不夺镇、又不许诸将还帅（gpt-08 #1、gpt-09 #6）：兵变之险此后长存，须逐季明示并给出对策。
# 处置后隔三季复议（事件 fanyang_kept_rearm），直至夺镇、许还或安抚满三策。
- id: p_fanyang_kept
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_kept_in_capital, value: true}
      - {kind: flag, operator: eq, key: fanyang_restive, value: true}
      - {kind: character_region, operator: eq, character: an_lushan, region: jingji}
      - {kind: character_status, operator: eq, character: shi_siming, value: alive}
