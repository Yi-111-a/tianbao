    - {character: gao_lishi, stance: neutral, line: 老奴听说，朔方军里有个郭子仪，士卒都肯为他死。}
    - {character: guo_ziyi, stance: neutral, line: 臣名位尚卑，唯陛下所使。}
  options:
    - id: guo
      label: 以郭子仪知朔方节度
      memory: {character: guo_ziyi, text: 陛下破格以臣知朔方节度}
      ops:
        - {op: dismiss, character: li_linfu, office: shuofang_jds}
        - {op: appoint, character: guo_ziyi, office: shuofang_jds}
        - {op: set_army_commander, army: shuofang_army, character: guo_ziyi}
        - {op: set_flag, key: shuofang_reliable, value: true}
        - {op: adjust_resource, resource: fanzhen_power, delta: -2, reason: 节度不兼}
