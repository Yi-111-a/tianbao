# 中枢官缺（gpt-07 #8）：右相、左相、判度支、御史中丞、京兆尹任一出缺满两季即见（计数器 vacant_*）。处置后隔四季复议。
- id: p_vacancies
  conditions:
    any:
      - {kind: counter, key: vacant_you_xiang, operator: gte, value: 2}
      - {kind: counter, key: vacant_zuo_xiang, operator: gte, value: 2}
      - {kind: counter, key: vacant_duzhi, operator: gte, value: 2}
      - {kind: counter, key: vacant_yushi_zhongcheng, operator: gte, value: 2}
      - {kind: counter, key: vacant_jingzhao_yin, operator: gte, value: 2}
  title: 中枢官缺
  keywords: [官缺, 出缺, 补授, 有司代行]
  summary: >-
    中书奏：中枢要职有久缺不补者（右相、左相、判度支、御史中丞、京兆尹之中，出缺已满两季者见官职表「出缺」一栏），诸司以次官代行，事多稽滞。
    官缺满两季后，每缺每季小耗：相位君威 −0.3，判度支、御史中丞积弊 +0.3，京兆尹积弊 +0.2，补授之后即止。
    补授须以诏令 appoint 择人（人选须才具相当、未兼他职或未达兼职上限）；本条只决代行之法。
  region: jingji
  illustration: event.zhengshi_hall
  advisors:
    - {character: gao_lishi, stance: support, option: noted, line: 位子空着，底下的人便各行其是。陛下早些定了人吧。}
    - {character: chen_xilie, stance: neutral, option: acting, line: 诸司次官尚可代行一时，臣请暂委之。, requires: {office: [zuo_xiang, you_xiang]}}
  proposal: noted
  options:
    - id: noted
      label: 知道了，朕自择人，另以诏令处分
      ops: []
      hint: 不另处置；官缺之耗照旧，直到以诏令 appoint 补授（隔四季复议）
    - id: acting
      label: 令诸司次官权知其事，限期四季
      ops:
        - {op: set_flag, key: vacancy_acting, value: true}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 次官权知，责任不专}
        - {op: adjust_resource, resource: court_strife, delta: 1, reason: 诸司争权}
      hint: 积弊 +1，朝争 +1；此后四季内官缺不再逐季小耗（期满仍缺则复耗，奏疏复议）

- id: p_abdicate
  conditions:
