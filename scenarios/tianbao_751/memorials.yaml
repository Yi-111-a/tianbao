# gpt-10 #5：禄山已留京解镇（夺范阳节度），三道兵不复由其统领——请战者改为范阳诸将，与禄山无涉。
- id: t1_khitan_deputy
  variant_of: t1_khitan   # 同一议题按局势写的分支：禄山已留京解镇
  turn: 1
  conditions:
    all:
      - {not: {kind: flag, operator: exists, key: "memorial:t1_khitan"}}   # 同题分支：已处理其一则不再出现
      - {kind: flag, operator: eq, key: an_detained, value: true}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  title: 范阳诸将请讨契丹
  keywords: [契丹, 范阳将士]
  summary: 禄山既留京解镇，范阳诸将联名上言：契丹乘范阳易帅，游骑屡犯塞下，请发范阳、平卢兵出塞讨之。或言诸将欲借边功自固，宜令固守以俟朝命。
  region: fanyang
  illustration: event.fanyang_armoury
  advisors:
    - {character: li_linfu, stance: support, line: 边将请战，可壮军心，臣以为可许。, requires: {office: you_xiang}, option: approve}
    - {character: geshu_han, stance: oppose, line: 主帅才换，旧部便要出塞，打赢了功劳记在谁头上？, option: forbid}
    - {character: gao_lishi, stance: neutral, line: 新主还没坐稳，旧部先要动兵，老奴看着不放心。, option: forbid}
  proposal: approve
  options:
    - id: forbid
      label: 不许出塞，令范阳诸军固守，以俟朝命
      ops:
        - {op: set_flag, key: an_forbidden_khitan, value: true}
        - {op: adjust_resource, resource: frontier_pressure, delta: 2, reason: 契丹未受惩}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 号令出于朝廷}
      hint: 边患 +2，君威 +1；范阳兵不出塞，亦不受损
    - id: approve
      label: 准诸将出塞讨契丹
      ops:
        - {op: adjust_resource, resource: grain, delta: -60, reason: 军粮}
        - {op: adjust_resource, resource: frontier_pressure, delta: -2, reason: 出塞示威}
        - {op: adjust_resource, resource: fanzhen_power, delta: 1, reason: 边将擅功}
        - {op: adjust_resource, resource: rebellion_risk, delta: 2, reason: 旧部借边功自固}
      hint: 太仓 −60，边患 −2，外重内轻 +1，鼙鼓 +2（旧部借边功自固）；兵额不变

