  title: 范阳诸将久无主帅
  keywords: [范阳旧部, 还帅, 兵变, 欠饷, 留京]
  summary: >-
    禄山留京宿卫而仍领范阳节度，诸将请还帅不许，军中私议不息。兵变之险（逐季明示）：不许还帅之后宽限一季，此后每季结算，
    若禄山异志风闻偏高（约 55 以上），按安抚之策掷一次——无策约 35%，一策约 20%，二策约 8%，三策以上不发。危机计「渔阳鼙鼓」不计此险，承平之时亦然。
    对策：罢其范阳节度、另择新帅（并入留京夺镇，此后兵变之险与三策安抚照旧）；清偿欠饷、下诏不问旧部（安抚之策 +2）；许禄山还镇（险除而兵柄复归）。
  region: fanyang
  illustration: event.fanyang_armoury
  advisors:
    - {character: gao_lishi, stance: support, line: 人留着，兵也悬着，这样耗下去，早晚出事。要么换帅，要么放他回去。, option: disarm}
    - {character: yang_guozhong, stance: oppose, line: 放回去？那是纵虎归山！, option: pay}
  proposal: disarm
  options:
    - id: disarm
      label: 罢禄山范阳节度，留京奉朝请，另择新帅
      appoints_via: fanyang_successor
      memory: {character: an_lushan, text: 留京既久，朝廷又罢我范阳节度}
      ops:
        - {op: dismiss, character: an_lushan, office: fanyang_jds}
      hint: 禄山免范阳节度，结算时并入留京夺镇（兵柄再 −30，平卢、河东兼职随后解去）；范阳出缺则另有抉择择帅；兵变之险照旧按安抚之策计（见奏疏「范阳旧部可虑」），新帅到镇且满三策后旧部归心
    - id: pay
      label: 清偿欠饷，下诏不问旧部
      ops:
        - {op: adjust_resource, resource: treasury, delta: -160, reason: 清偿范阳欠饷、赐物}
        - {op: adjust_counter, key: fanyang_measures, delta: 2}
        - {op: set_flag, key: fanyang_paid, value: true}
        - {op: set_flag, key: fanyang_amnesty, value: true}
      hint: 国库 −160；安抚之策 +2（两策：每季兵变之险约 8%；满三策方不发）
    - id: return
      label: 许禄山还镇
      memory: {character: an_lushan, text: 留京既久，陛下终许我还镇}
      ops:
        - {op: move_character, character: an_lushan, to_region: fanyang}
        - {op: adjust_resource, resource: an_command, delta: 40, reason: 归镇复掌其兵}
        - {op: set_flag, key: an_kept_in_capital, value: false}
        - {op: adjust_resource, resource: rebellion_risk, delta: 3, reason: 归镇而疑}
      hint: 禄山启程还镇（行程按实际路线计）；兵柄 +40，鼙鼓 +3；旧部兵变之险随之而除，起兵之险复归危机计
    - id: ignore
      label: 置之不问
      ops:
        - {op: adjust_resource, resource: court_strife, delta: 1, reason: 诸将上表不报}
      hint: 朝争 +1；兵变之险照旧（无策约 35%／季）；约三季后复议

