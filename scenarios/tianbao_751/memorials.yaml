      - {kind: character_region, operator: eq, character: xuanzong, region: jingji}
      - {not: {kind: flag, operator: eq, key: court_fled, value: true}}
  title: 幸蜀之议
  summary: 潼关已失，叛军旦夕可至。杨国忠请幸蜀，或请固守长安。
  region: jingji
  advisors:
    - {character: yang_guozhong, stance: support, line: 剑南臣经营已久，请陛下幸蜀。}
    - {character: gao_lishi, stance: neutral, line: 走与不走，都要快。}
  options:
    - id: west
      label: 车驾西幸
      ops:
        - {op: move_character, character: xuanzong, to_region: jiannan}
        - {op: set_flag, key: court_fled, value: true}
        - {op: adjust_resource, resource: authority, delta: -4, reason: 弃京师}
      hint: 君威 −4；车驾离京（马嵬之变或随之而起）
    - id: stay
      label: 固守长安
      ops:
        - {op: adjust_region, region: jingji, stat: defense, delta: 10}
        - {op: set_flag, key: capital_defended, value: true}
        - {op: adjust_resource, resource: authority, delta: 3, reason: 天子守国门}
      hint: 京畿防务 +10，君威 +3；城破则终局

- id: r_relief
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_started, value: true}
      - {kind: flag_age, key: rebellion_started, operator: gte, value: 1}
      - {not: {kind: flag, operator: eq, key: war_relief_done, value: true}}
  title: 安辑流民
  summary: 河南、河北流民西奔，关中米价腾贵。请发仓赈给，募流民为兵。
  region: henan
  advisors:
    - {character: yan_zhenqing, stance: support, line: 民心即城池。}
    - {character: yang_guozhong, stance: oppose, line: 军需尚且不足，哪有余粮？}
  options:
    - id: relief
      label: 发仓赈给
      ops:
        - {op: adjust_resource, resource: grain, delta: -120, reason: 赈流民}
        - {op: adjust_resource, resource: morale, delta: 5, reason: 安辑}
        - {op: set_flag, key: war_relief_done, value: true}
      hint: 太仓 −120，民心 +5
    - id: enlist
      label: 募流民为兵
      ops:
        - {op: adjust_army, army: jinjun, delta: 15000, reason: 募流民}
        - {op: adjust_resource, resource: treasury, delta: -100, reason: 募兵}
        - {op: set_flag, key: war_relief_done, value: true}
      hint: 禁军 +1.5万，国库 −100

- id: r_tax
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_started, value: true}
      - {kind: flag_age, key: rebellion_started, operator: gte, value: 2}
      - {not: {kind: flag, operator: eq, key: war_tax_done, value: true}}
  title: 军兴用度
  summary: 军兴用度不足。度支请税商贾、卖官爵；或请出内库以给军。
  region: jingji
  advisors:
    - {character: yang_guozhong, stance: support, line: 商贾富足，借之何妨。}
    - {character: gao_lishi, stance: neutral, line: 内库的东西，陛下用得上的时候，就该用。}
  options:
    - id: merchants
      label: 税商贾、鬻官爵
      ops:
        - {op: adjust_resource, resource: treasury, delta: 300, reason: 军兴税敛}
        - {op: adjust_resource, resource: corruption, delta: 5, reason: 鬻官}
        - {op: adjust_resource, resource: morale, delta: -3, reason: 扰商}
        - {op: set_flag, key: war_tax_done, value: true}
      hint: 国库 +300，积弊 +5，民心 −3
    - id: palace
      label: 出内库给军
      ops:
        - {op: adjust_resource, resource: treasury, delta: 200, reason: 出内库}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 天子节用}
        - {op: set_flag, key: war_tax_done, value: true}
      hint: 国库 +200，君威 +2

