# ============================== 战时常备奏疏（三题、各三班轮值） ==============================
# 引擎的奏疏处理标记本身不支持 cooldown；这里以既有条件 / StateOp 实现轮值，不改引擎。
# 每题以 slot 计数器选当前班（缺省 0），last 旗标保证本季批过便不再出下一班。
# 各班另记独立冷却时钟：处理后至少隔三季；所有选项都推进轮值，次季案牍勘会后清空下一班处理标记。
# 勘会用一季、不另计钱粮；竣工效果只清下一班标记，不清冷却时钟，也不伪造一次奏疏采纳记录。
# 重复列出、同季连批或延后处理均不能绕过间隔；三题每季各有一案。
# repeatable / cooldown 为 content_lint 校验用元数据；仅这三题豁免战局专题的「至多两见」。

- id: wp_standing_pay_1
  war_pool: standing_pay
  repeatable: true
  cooldown: 3
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_started, value: true}
      - {not: {kind: flag, operator: eq, key: rebellion_quelled, value: true}}
      - {not: {kind: flag, operator: eq, key: hebei_ceded, value: true}}
      - {kind: counter, key: 'war_pool:standing_pay:slot', operator: eq, value: 0}
      - {any: [{kind: flag, key: 'war_pool:standing_pay:last', operator: absent}, {kind: flag_age, key: 'war_pool:standing_pay:last', operator: gte, value: 1}]}
      - {any: [{kind: flag, key: 'cooldown:wp_standing_pay_1', operator: absent}, {kind: flag_age, key: 'cooldown:wp_standing_pay_1', operator: gte, value: 3}]}
  title: 诸军请饷·核军籍
  summary: 军兴未息，诸军衣粮须按籍支给。度支请出钱补其不给；或量减缣帛之数，留钱以备转输。
  region: jingji
  illustration: event.tax_treasury
  advisors:
    - {character: yan_zhenqing, stance: support, line: 士卒冒锋镝，不可使衣粮失所。请按籍给饷，以固其心。, option: pay}
    - {character: gao_lishi, stance: oppose, line: 军需无穷，帑藏有限。量减缣帛，尚可留钱济急。, option: reduce}
  proposal: pay
  options:
    - id: pay
      label: 按籍给饷
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 按籍补给军饷}
        - {op: adjust_resource, resource: morale, delta: 2, reason: 衣粮有给}
        - {op: set_flag, key: 'war_pool:standing_pay:last', value: true}
        - {op: set_flag, key: 'cooldown:wp_standing_pay_1', value: true}
        - {op: set_counter, key: 'war_pool:standing_pay:slot', value: 1}
        - op: start_project
          name: 军饷簿勘会
          region: jingji
          cost_per_turn: {}
          turns: 1
          on_complete:
            - {op: set_flag, key: 'memorial:wp_standing_pay_2', value: null}
      hint: 国库 −30，民心 +2；本题下季再议，本条隔三季轮值
    - id: reduce
      label: 量减缣帛，留钱济急
      ops:
        - {op: adjust_resource, resource: treasury, delta: 15, reason: 裁减军中缣帛}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 军中怨饷薄}
        - {op: set_flag, key: 'war_pool:standing_pay:last', value: true}
        - {op: set_flag, key: 'cooldown:wp_standing_pay_1', value: true}
        - {op: set_counter, key: 'war_pool:standing_pay:slot', value: 1}
        - op: start_project
          name: 军饷簿勘会
          region: jingji
          cost_per_turn: {}
          turns: 1
          on_complete:
            - {op: set_flag, key: 'memorial:wp_standing_pay_2', value: null}
      hint: 国库 +15，君威 −1；本题下季再议，本条隔三季轮值

