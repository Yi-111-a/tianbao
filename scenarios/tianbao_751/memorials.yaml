# ============================== 乱局奏疏池（round 8：按战局出现，同一题目每场战事至多两见） ==============================
# 取代旧「乱局逐季条目」（每季同一套军需 / 补兵 / 忠义三条）。每条以 war_pool 标明题目；同题第二条（id 后缀 _2）须第一条已处理且隔三季以上，
# 标题另写，content_lint 检查同题至多两条、第二条的守卫、以及乱局共同条件（已起兵、未平、未许镇河北）。
# 进讨类选项（进剿、断粮、招抚、东讨）设旗标 court_offensive：乱起三季后连续两季无进讨之举，则有「师老财匮」「贼逼潼关」之压。
# 战功（计数器 war_merit）只记官军亲手取得之效：收复东都 / 河北 / 范阳（事件）、焚其积聚、义兵截击、招降胁从；「再造唐室」须战功 ≥ 2。

