# 奏疏条目（CONTRACT §1.10）。T0–T3 为教程脚本；此后每季至少三条，另有按条件出现的史事环节与常设条目。
# 次序约定：凡奏疏所问之事，相关事件一律在其后一季（或由选项直接执行），不得先于奏疏发生。
# memory: {character, text} 为该选项写入人物记忆（引擎支持后生效）。
# 采纳某选项即把其 ops 加入诏书草案；确认后写入 flag memorial:<id> = option_id。
# 文本为本游戏写作（【虚】）；涉及史事处以 docs/FACT_CHECK.md 为准。hint 中「异志（风闻）」指隐藏数值。

# ============================== T0 天宝十载春（序章） ==============================
- id: t0_hedong
  turn: 0
  title: 河东节度出缺
  summary: 河东节度使出缺。安禄山请兼领，并荐吉温为节度副使、知留后。若不处置，下季制书照例施行。
  region: hedong
  illustration: event.hedong_grant
  proposal: grant
  advisors:
    - {character: li_linfu, stance: support, option: grant, line: 陛下圣明。蕃将无党援，专任之，边事可无忧。, requires: {office: you_xiang}}
    - {character: gao_lishi, stance: neutral, line: 圣意所在，老奴不敢多言。, option: grant_watch}
    - {character: yang_guozhong, stance: oppose, option: deny, line: 三镇之兵近二十万，尽付一胡，臣以为不可。}
  options:
    - id: deny
      label: 驳回，另择河东节度（下季择人），并厚赐金帛
      appoints_via: hedong_successor   # 后续抉择实授（content_lint 据此核对）
      memory: {character: an_lushan, text: 天宝十载春，求兼河东节度，陛下不许，另赐金帛}
      ops:
        - {op: set_flag, key: hedong_denied, value: true}
        - {op: adjust_resource, resource: fanzhen_power, delta: -3, reason: 河东别授}
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 厚赐禄山}
        - {op: adjust_resource, resource: an_ambition, delta: -2, reason: 恩赐以安其心}
      hint: 外重内轻 −3，国库 −60，异志（风闻）↓；下季「河东择帅」抉择实授节度（逾期默认李光弼）
    - id: grant_watch
      label: 准兼河东，副使改由朝廷简派
      memory: {character: an_lushan, text: 天宝十载春，陛下许我兼领河东，副使却由朝廷简派}
      ops:
        - {op: appoint, character: an_lushan, office: hedong_jds}
        - {op: set_army_commander, army: hedong_army, character: an_lushan}
        - {op: adjust_resource, resource: fanzhen_power, delta: 5, reason: 禄山兼三镇}
        - {op: adjust_resource, resource: an_ambition, delta: 2, reason: 副使非其人}
        - {op: set_flag, key: hedong_to_an, value: true}
        - {op: set_flag, key: hedong_secured, value: true}
      hint: 禄山兼统河东军（遥领，人不赴太原）；外重内轻 +5；乱时太原或可拒命
    - id: grant
      label: 照准，并赐铁券
      memory: {character: an_lushan, text: 天宝十载春，陛下许我兼领河东，并赐铁券}
      ops:
        - {op: appoint, character: an_lushan, office: hedong_jds}
        - {op: set_army_commander, army: hedong_army, character: an_lushan}
        - {op: adjust_resource, resource: fanzhen_power, delta: 8, reason: 安禄山兼领三镇}
        - {op: adjust_resource, resource: an_ambition, delta: 3, reason: 兵权日重}
        - {op: set_flag, key: hedong_to_an, value: true}
      hint: 禄山兼统河东军（遥领，人不赴太原）；外重内轻 +8（史事）

- id: t0_xier
  turn: 0
  title: 禄山生辰
  summary: 安禄山生辰，陛下与贵妃赐衣物、宝器。贵妃欲于宫中行「洗儿」之戏，禄山出入禁中，外议颇多。
  region: jingji
  illustration: event.xi_er
  advisors:
    - {character: yang_guozhong, stance: support, line: 厚赐以示恩宠，范阳必感激图报。, option: lavish}
    - {character: yan_zhenqing, stance: oppose, line: 礼者，所以别嫌明微。边将出入宫掖，非礼也。, option: rites}
    - {character: yang_guifei, stance: support, line: 不过一场玩笑，三郎何必当真？, option: lavish}
  proposal: lavish
  options:
    - id: modest
      label: 依常例赏赐，禁中出入有节
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 生辰赏赐}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 宫禁有度}
      hint: 国库 −30，君威 +1
    - id: lavish
      label: 厚赐，并许其出入宫禁
      memory: {character: an_lushan, text: 生辰之日，陛下与贵妃厚赐，许我出入宫禁}
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 厚赐}
        - {op: adjust_resource, resource: corruption, delta: 2, reason: 宫禁不严}
        - {op: adjust_resource, resource: court_strife, delta: 3, reason: 外议纷纷}
        - {op: adjust_resource, resource: an_ambition, delta: -2, reason: 恩宠}
      hint: 国库 −80，积弊 +2，朝争 +3，异志（风闻）↓
    - id: rites
      label: 从颜真卿之议，罢洗儿之戏
      memory: {character: an_lushan, text: 生辰之日，颜真卿进言，罢了洗儿之戏}
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 守礼}
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 恩意稍薄}
        - {op: adjust_trait, character: yang_guifei, trait: favor, delta: -1}
      hint: 君威 +2，异志（风闻）↑

- id: t0_nanzhao
  turn: 0
  title: 南诏陷姚州
  summary: 云南太守张虔陀侮慢南诏王阁罗凤，南诏怒而攻陷云南郡。剑南节度使鲜于仲通请发兵八万讨之。
  region: jiannan
  illustration: event.xier_defeat
  advisors:
    - {character: yang_guozhong, stance: support, line: 蛮夷犯顺，不讨无以示威。仲通一出，指日可平。, option: campaign}
    - {character: gao_xianzhi, stance: oppose, line: 西南山险瘴深，不宜深入。, option: appease}
    - {character: xianyu_zhongtong, stance: support, line: 南诏小蛮，臣发兵一举可平。, option: campaign}
  proposal: campaign
  options:
    - id: appease
      label: 查办张虔陀之过，许南诏谢罪
      memory: {character: xianyu_zhongtong, text: 请讨南诏，陛下不许，反查办张虔陀}
      ops:
        - {op: set_flag, key: nanzhao_appeased, value: true}
        - {op: adjust_resource, resource: frontier_pressure, delta: -2, reason: 西南罢兵}
        - {op: adjust_resource, resource: court_strife, delta: 1, reason: 国忠不悦}
      hint: 边患 −2，朝争 +1；免西洱河之败
    - id: campaign
      label: 准仲通所请，发兵讨之
      ops:
        - {op: set_flag, key: nanzhao_campaign, value: true}
        - {op: adjust_resource, resource: treasury, delta: -100, reason: 南征军费}
      hint: 国库 −100；南征（史事）

- id: t0_anxi
  turn: 0
  title: 高仙芝献俘
  summary: 高仙芝入朝献俘。朝议欲以仙芝代安思顺镇河西，河西诸胡割耳剺面请留思顺。仙芝又请再讨石国余党。
  region: jingji   # 献俘、廷议都在长安（驿程见 regions.yaml：安西奏报晚一季，此条不是安西来奏）
  illustration: event.anxi_triumph
  advisors:
    - {character: li_linfu, stance: neutral, line: 诸胡之心可用，臣以为宜留思顺。, requires: {office: you_xiang}, option: restrain}
    - {character: gao_xianzhi, stance: support, line: 石国余党投大食，不早除，后患不小。, option: campaign}
    - {character: geshu_han, stance: oppose, line: 西陲已苦战数年，士卒当歇一歇了。, option: restrain}
  proposal: campaign
  options:
    - id: restrain
      label: 留思顺于河西，命仙芝不得擅启边衅
      ops:
        - {op: set_flag, key: anxi_restrained, value: true}
        - {op: adjust_resource, resource: frontier_pressure, delta: 1, reason: 西域小警}
      hint: 边患 +1；免怛罗斯之败
    - id: campaign
      label: 准仙芝讨石国余党
      ops:
        - {op: set_flag, key: anxi_deep_campaign, value: true}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 西征军费}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 远略}
      hint: 国库 −40，君威 +1；深入（史事）

- id: t0_huaqing
  turn: 0
  title: 府库充盈
  summary: >-
    度支奏称左藏、太仓充盈，岁入有余，请修缮华清宫以备冬幸。（此为度支所奏；府库实数以账目为准）
    本年岁计：诸道税入、租米之外，诸军衣赐粮料按现有兵额逐季支给（每万兵约 2.5 万贯、1.1 万石，开局约 134 万贯、59 万石），
    另有边镇杂支 31、宫廷用度 45 万贯与京师禄米 66 万石；均自本季结算起支出（固定三项首季由「岁计定额」补扣，此后列入经常收支）。
  region: jingji
  illustration: event.huaqing_winter
  advisors:
    - {character: yang_guozhong, stance: support, line: 今岁所入，较往岁又增，皆陛下洪福。修宫室正当其时。, option: palace}
    - {character: gao_lishi, stance: oppose, line: 老奴斗胆：宿卫诸军，久不操练了。, option: train}
    - {character: chen_xilie, stance: neutral, line: 右相与度支所言皆是，臣无异议。, requires: {office: [zuo_xiang, you_xiang]}, option: palace}
  proposal: palace
  options:
    - id: train
      label: 拨款整训京畿禁军
      ops:
        - op: start_project
          name: 禁军整训
          region: jingji
          cost_per_turn: {treasury: 60}
          turns: 4
          on_complete:
            - {op: adjust_army, army: jinjun, delta: 10000, reason: 禁军整训}
            - {op: adjust_region, region: jingji, stat: defense, delta: 10}
            - {op: adjust_resource, resource: fanzhen_power, delta: -4, reason: 内重稍复}
      hint: 每季 −60 共四季；成后禁军 +1万、京畿防务 +10、外重内轻 −4；此后养兵每季 +2.5 万贯、粮 +1.1 万石
    - id: palace
      label: 营建华清宫
      ops:
        - {op: adjust_resource, resource: treasury, delta: -100, reason: 营建宫室}
        - {op: adjust_resource, resource: corruption, delta: 3, reason: 工役侵渔}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 盛世气象}
      hint: 国库 −100，积弊 +3，君威 +1
    - id: remit
      label: 减免关辅租调
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 蠲免}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 宽民力}
      hint: 国库 −80，民心 +3

# ============================== T1 天宝十载夏 ==============================
- id: t1_xier_report
  conditions:
    all:
      - {kind: turn, operator: eq, value: 1}
      - {kind: flag, operator: eq, key: xier_defeat, value: true}
  title: 西洱河败报
  summary: 西洱河败报至。杨国忠为鲜于仲通叙功，请于两京及河南、河北分道募兵，再征南诏。
  region: jiannan
  illustration: event.xier_defeat
  advisors:
    - {character: yang_guozhong, stance: support, line: 小挫而已，臣已筹得军资，再发兵数万，必雪此耻。, option: conscript}
    - {character: yan_zhenqing, stance: oppose, line: 六万之众，一朝覆没，而以功闻，欺天也。, option: peace}
    - {character: gao_lishi, stance: neutral, line: 老奴听说，募兵的道上，哭声不绝。, option: peace}
  proposal: conscript
  options:
    - id: peace
      label: 追究败责，罢兵议和
      memory: {character: yang_guozhong, text: 西洱河败后，陛下追究败责，罢兵议和}
      ops:
        - {op: set_flag, key: nanzhao_peace, value: true}
        - {op: adjust_resource, resource: frontier_pressure, delta: -3, reason: 罢兵}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 赏罚分明}
        - {op: adjust_resource, resource: court_strife, delta: 3, reason: 国忠衔恨}
      hint: 边患 −3，君威 +1，朝争 +3；免后续南征（改革之阻：朝争不会自行回落，可经奏疏「朝堂调停」化解）
    - id: conscript
      label: 准分道募兵，再图南诏
      ops:
        - {op: adjust_resource, resource: morale, delta: -5, reason: 强征}
        - {op: adjust_resource, resource: corruption, delta: 3, reason: 募兵扰民}
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 募兵}
        - {op: adjust_army, army: jiannan_army, delta: 15000, reason: 分道募兵}
      hint: 剑南军 +15000，民心 −5，积弊 +3，国库 −80（史事）；此后养兵每季 +3.75 万贯、粮 +1.65 万石

