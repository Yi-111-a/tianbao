# ============================== T18 天宝十四载秋 ==============================
- id: t18_last
  conditions:
    all:
      - {kind: turn, operator: eq, value: 18}
      - {kind: character_region, operator: eq, character: an_lushan, region: fanyang}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  title: 最后的宣慰
  summary: 冬将至。或请陛下以手诏许禄山世镇范阳、子孙承袭，以安其心；或请先发制人。
  region: fanyang
  advisors:
    - {character: yang_guifei, stance: support, line: 给他个定心丸，他便不闹了。}
    - {character: yang_guozhong, stance: oppose, line: 许他世镇？那范阳便不是大唐的了！}
    - {character: gao_lishi, stance: neutral, line: 这一步，陛下得自己拿主意。}
  options:
    - id: hereditary
      label: 手诏许其世镇
      memory: {character: an_lushan, text: 陛下手诏许我世镇范阳，子孙承袭}
      ops:
        - {op: adjust_resource, resource: an_ambition, delta: -6, reason: 世镇之许}
        - {op: adjust_resource, resource: rebellion_risk, delta: -6, reason: 心安}
        - {op: adjust_resource, resource: fanzhen_power, delta: 8, reason: 藩镇世袭}
        - {op: adjust_resource, resource: authority, delta: -4, reason: 割地求安}
      hint: 鼙鼓 −6，外重内轻 +8，君威 −4
    - id: preempt
      label: 先调诸道兵屯河南
      ops:
        - {op: adjust_region, region: henan, stat: defense, delta: 10}
        - {op: adjust_region, region: duji, stat: defense, delta: 5}
        - {op: adjust_resource, resource: treasury, delta: -100, reason: 调兵}
        - {op: adjust_resource, resource: rebellion_risk, delta: 3, reason: 风声外泄}
      hint: 河南防务 +10，都畿 +5，国库 −100，鼙鼓 +3

- id: t18_hebei_watch
  turn: 18
  title: 河北诸郡
  summary: 平原太守请密为城守之备，常山诸郡亦有忠义之士可用。
  region: hebei
  advisors:
    - {character: yan_zhenqing, stance: support, line: 臣已阴为之备，请陛下许臣便宜行事。}
    - {character: chen_xilie, stance: oppose, line: 打草惊蛇，恐生变故。}
  options:
    - id: permit
      label: 许河北诸郡便宜城守
      memory: {character: yan_zhenqing, text: 陛下许河北诸郡便宜城守}
      ops:
        - {op: adjust_region, region: hebei, stat: defense, delta: 8}
        - {op: adjust_region, region: hebei, stat: order, delta: 5}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 城守}
      hint: 河北防务 +8、治安 +5，国库 −40
    - id: wait
      label: 静观其变
      ops:
        - {op: adjust_resource, resource: rebellion_risk, delta: -1, reason: 不惊范阳}
      hint: 鼙鼓 −1

- id: t18_tongguan
  turn: 18
  title: 关防
  summary: 潼关、蒲津诸关请增兵。河东军可就近入关。
  region: tongguan
  advisors:
    - {character: gao_lishi, stance: support, line: 门闩要插紧。}
    - {character: yang_guozhong, stance: oppose, line: 兵一动，范阳便有了借口。}
  options:
    - id: hedong
      label: 河东军入屯潼关
      ops:
        - {op: move_army, army: hedong_army, to_region: tongguan}
        - {op: set_army_commander, army: hedong_army, character: null}
        - {op: set_flag, key: hedong_secured, value: true}
        - {op: adjust_resource, resource: rebellion_risk, delta: 2, reason: 风声外泄}
      hint: 河东军改隶朝廷，下季抵潼关；鼙鼓 +2
    - id: jinjun
      label: 禁军一部出屯潼关
      ops:
        - {op: move_army, army: jinjun, to_region: tongguan}
        - {op: adjust_region, region: jingji, stat: defense, delta: -5}
      hint: 禁军下季抵潼关；京畿防务 −5

- id: t18_huaqing
  turn: 18
  title: 冬幸华清
  summary: 有司请以十月幸华清宫，百官从驾，杨氏诸家随行。
  region: jingji
  advisors:
    - {character: yang_guifei, stance: support, line: 温汤正好，三郎今年也带妾去罢。}
    - {character: gao_lishi, stance: oppose, line: 今冬风声不好，老奴以为，陛下还是在长安的好。}
  options:
    - id: go
      label: 依例幸华清宫
      ops:
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 巡幸}
        - {op: adjust_resource, resource: authority, delta: -1, reason: 政事稽迟}
        - {op: adjust_resource, resource: court_strife, delta: -1, reason: 宫中和睦}
      hint: 国库 −60，君威 −1，朝争 −1
    - id: stay
      label: 罢幸，留京听政
      ops:
        - {op: adjust_resource, resource: authority, delta: 2, reason: 勤政}
        - {op: adjust_resource, resource: court_strife, delta: 1, reason: 杨氏怏怏}
        - {op: adjust_trait, character: yang_guifei, trait: favor, delta: -1}
      hint: 君威 +2，朝争 +1
    - id: short
      label: 只驻旬日即还
      ops:
        - {op: adjust_resource, resource: treasury, delta: -30, reason: 巡幸}
      hint: 国库 −30

