      ops:
        - {op: set_flag, key: an_forbidden_khitan, value: true}
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 所请不遂}
        - {op: adjust_resource, resource: frontier_pressure, delta: 2, reason: 契丹未受惩}
