# ============================== 善后（乱平后出现：叛军覆灭或首逆就擒） ==============================
- id: s_demobilize
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_quelled, value: true}
      - {kind: flag, operator: eq, key: jinjun_war_recruits, value: true}   # 乱中确有募兵补入禁军（募兵补伍、募流民为兵）
  title: 善后·复员
  keywords: [复员, 罢兵, 新募]
  summary: 叛乱既平，乱中所募之兵尚在禁军行伍，岁费浩大。或请放归田里，或请择其精壮留补禁旅。
  region: jingji
  illustration: event.recruit_levy
  advisors:
    - {character: gao_lishi, stance: support, line: 兵在京里久了，便要生事。放回去种地是正经。, option: release}
    - {character: guo_ziyi, stance: neutral, line: 放归可以，只是要给足了路粮，莫教他们流散为盗。, option: release}
  proposal: release
  options:
    - id: release
      label: 放还新募之兵，给路粮遣归
      ops:
        - {op: adjust_army, army: jinjun, delta: -15000, reason: 复员}
        - {op: adjust_resource, resource: treasury, delta: 60, reason: 省兵费}
        - {op: adjust_resource, resource: grain, delta: -40, reason: 路粮}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 归农}
      hint: 禁军 −1.5万，国库 +60，太仓 −40，民心 +3
    - id: keep_best
      label: 择精壮留补禁军，余众遣归
      ops:
        - {op: adjust_army, army: jinjun, delta: -6000, reason: 汰弱留强}
        - {op: adjust_resource, resource: fanzhen_power, delta: -2, reason: 内重稍复}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 赏遣}
      hint: 禁军 −6000，外重内轻 −2，国库 −20

- id: s_compensate
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_quelled, value: true}
      - any:   # 河北或东都确曾陷于叛军
          - {kind: flag, operator: eq, key: hebei_lost, value: true}
          - {kind: flag, operator: eq, key: duji_lost, value: true}
  title: 善后·抚恤
  keywords: [抚恤, 旌表, 死节]
  summary: 州县陷贼之处多遭兵燹，阵亡将士、死节守令之家待恤。请旌表忠义，给复其家。
  region: hebei
  illustration: event.loyalist_courier
  advisors:
    - {character: gao_lishi, stance: support, line: 死了的人，朝廷记着，活着的人才肯再拼。, option: honor}
    - {character: yang_guozhong, stance: oppose, line: 府库方空，抚恤从缓可也。, option: token}
  proposal: honor
  options:
    - id: honor
      label: 旌表死节，给复阵亡之家三年
      ops:
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 抚恤}
        - {op: adjust_resource, resource: morale, delta: 4, reason: 恤亡}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 忠义有报}
        - {op: adjust_region, region: hebei, stat: order, delta: 5}
      hint: 国库 −60，民心 +4，君威 +1，河北治安 +5
    - id: token
      label: 依常例赐物
      ops:
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 赐物}
        - {op: adjust_resource, resource: morale, delta: 1, reason: 恤亡}
      hint: 国库 −20，民心 +1

- id: s_canal
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_quelled, value: true}
      - {kind: flag, operator: eq, key: canal_was_cut, value: true}   # 漕运确曾阻绝（东都或河南陷贼）
  title: 善后·修复漕运
  keywords: [漕运, 汴渠, 修复]
  summary: 汴、洛漕路久为叛军所阻，堰闸失修多毁，江淮租米难以西上。请发丁修复。
  region: henan
  illustration: event.canal_cut
  advisors:
    - {character: yang_guozhong, stance: support, line: 漕路一通，太仓便满。臣愿督办。, requires: {office: [duzhi, you_xiang], region: jingji}, option: repair}
    - {character: gao_lishi, stance: neutral, line: 修是要修的，只别又累坏了河南百姓。, option: repair}
  proposal: repair
  options:
    - id: repair
      label: 发丁修复汴洛漕路
      ops:
        - op: start_project
          name: 修复汴洛漕路
          region: henan
          cost_per_turn: {treasury: 40}
          turns: 2
          on_complete:
            - {op: adjust_region, region: henan, stat: grain, delta: 4}
            - {op: adjust_region, region: duji, stat: grain, delta: 3}
            - {op: adjust_resource, resource: grain, delta: 100, reason: 漕路复通}
      hint: 每季 −40 共两季；成后太仓 +100，河南、都畿粮产 +7
    - id: route
      label: 暂由襄汉转运
      ops:
        - {op: adjust_resource, resource: grain, delta: 60, reason: 襄汉转运}
        - {op: adjust_resource, resource: treasury, delta: -40, reason: 运费}
      hint: 太仓 +60，国库 −40

- id: s_finance
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_quelled, value: true}
      - {kind: flag, operator: eq, key: war_levies, value: true}   # 乱中确曾加征（税商鬻官、铸大钱、榷盐）
  title: 善后·整顿财计
  keywords: [财政, 度支, 税敛, 鬻官]
  summary: 军兴以来所加诸税（税商贾、鬻官爵、铸大钱、榷盐之类）尚在。乱既平，或请罢除，或请留以实府库。
  region: jingji
  illustration: event.tax_treasury
  advisors:
    - {character: yang_guozhong, stance: oppose, line: 府库方空，骤罢诸税，拿什么养兵？, option: keep}
    - {character: gao_lishi, stance: support, line: 乱时的法子，乱后还用，百姓便要问：这乱到底平了没有？, option: abolish}
  proposal: abolish
  options:
    - id: abolish
      label: 罢军兴诸税，停鬻官爵
      ops:
        - {op: adjust_resource, resource: corruption, delta: -4, reason: 罢鬻官}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 宽商}
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 少入}
      hint: 积弊 −4，民心 +3，国库 −50
    - id: keep
      label: 留商税以实府库，停鬻官爵
      ops:
        - {op: adjust_resource, resource: treasury, delta: 60, reason: 商税}
        - {op: adjust_resource, resource: corruption, delta: -1, reason: 停鬻官}
      hint: 国库 +60，积弊 −1

- id: s_rewards
  conditions: {kind: flag, operator: eq, key: rebellion_quelled, value: true}
  title: 善后·论功行赏
  keywords: [论功, 行赏, 封赏]
  summary: 平乱诸将请叙功。或请厚加封爵、许以节度世袭；或请赐爵加阶而兵权归朝。
  region: jingji
  illustration: event.court_festival
  advisors:
    - {character: guo_ziyi, stance: neutral, line: 将士之功，请陛下厚赏；臣一身之爵，不敢多求。, option: honor_recall}
    - {character: gao_lishi, stance: support, line: 赏要厚，兵要收。前一个禄山，就是赏了兵权出来的。, option: honor_recall}
  proposal: honor_recall
  options:
    - id: honor_recall
      label: 厚赏将士，赐爵加阶，兵权归朝
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 赏功}
        - {op: adjust_resource, resource: fanzhen_power, delta: -5, reason: 兵权归朝}
        - {op: adjust_resource, resource: authority, delta: 2, reason: 赏罚分明}
      hint: 国库 −80，外重内轻 −5，君威 +2
    - id: hereditary
      label: 许诸将分镇河北，子孙承袭
      ops:
        - {op: adjust_resource, resource: fanzhen_power, delta: 8, reason: 诸将分镇}
        - {op: adjust_resource, resource: authority, delta: -2, reason: 名器假人}
        - {op: adjust_resource, resource: frontier_pressure, delta: -2, reason: 诸镇自守}
      hint: 外重内轻 +8，君威 −2，边患 −2（藩镇之渐）

# 乱平次季起（善后第二季）：安辑、边备、处置附逆
- id: s_hebei
  conditions:
    all:
      - {kind: flag_age, key: rebellion_quelled, operator: gte, value: 1}
      - {kind: flag, operator: eq, key: hebei_lost, value: true}   # 河北确曾陷于叛军
  title: 善后·安辑河北
  keywords: [河北, 安辑, 宣抚]
  summary: 河北诸州乱后户口流散，田多荒芜，守令多缺。请遣使宣抚，或以朝官分治诸州。
  region: hebei
  illustration: event.refugees_granary
  advisors:
    - {character: gao_lishi, stance: support, line: 河北的百姓吃过一回苦了，朝廷先给口饭，人心便回来了。, option: relief}
    - {character: yang_guozhong, stance: neutral, line: 蠲免一年，度支便少一年的租调，陛下须想好。, option: officials}
  proposal: relief
  options:
    - id: relief
      label: 遣使宣抚，蠲免河北租调一年
      ops:
        - {op: adjust_resource, resource: treasury, delta: -60, reason: 蠲免河北}
        - {op: adjust_region, region: hebei, stat: order, delta: 8}
