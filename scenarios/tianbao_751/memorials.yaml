      ops:
        - {op: dismiss, character: li_linfu, office: shuofang_jds}
        - {op: appoint, character: li_guangbi, office: shuofang_jds}
        - {op: set_army_commander, army: shuofang_army, character: li_guangbi}
        - {op: set_flag, key: shuofang_reliable, value: true}
        - {op: adjust_resource, resource: fanzhen_power, delta: -2, reason: 节度不兼}
        - {op: adjust_resource, resource: court_strife, delta: 2, reason: 拂右相之意}
      hint: 外重内轻 −2，朝争 +2；朔方可恃
    - id: sishun
      label: 依右相，以安思顺兼领
      ops:
        - {op: dismiss, character: li_linfu, office: shuofang_jds}
        - {op: appoint, character: an_sishun, office: shuofang_jds}
        - {op: set_army_commander, army: shuofang_army, character: an_sishun}
        - {op: adjust_resource, resource: fanzhen_power, delta: 2, reason: 两镇并于一人}
      hint: 外重内轻 +2（史事，十一载行之）

- id: t2_census
  turn: 2
  title: 秋税入库·括户之议
  summary: 秋税入库。户籍多有隐漏，或请遣御史分道括户；度支则请变造诸州轻货，以实左藏。
  region: jingji
  advisors:
    - {character: yang_guozhong, stance: support, line: 诸州轻货变造入京，一转手便是百余万贯。}
    - {character: yan_zhenqing, stance: oppose, line: 聚敛之臣，不如盗臣。请遣御史分道按察。}
  options:
    - id: censors
      label: 遣御史分道按察
      ops:
        - {op: adjust_resource, resource: corruption, delta: -3, reason: 御史按察}
        - {op: adjust_resource, resource: morale, delta: -1, reason: 括户扰民}
        - {op: adjust_resource, resource: treasury, delta: -20, reason: 巡按之费}
      hint: 积弊 −3，民心 −1，国库 −20
    - id: convert
      label: 依度支变造轻货
      ops:
        - {op: adjust_resource, resource: treasury, delta: 150, reason: 变造轻货}
        - {op: adjust_resource, resource: corruption, delta: 5, reason: 聚敛}
        - {op: adjust_trait, character: yang_guozhong, trait: favor, delta: 1}
      hint: 国库 +150，积弊 +5
    - id: lenient
      label: 宽免逋负
      ops:
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 免逋}
        - {op: adjust_resource, resource: morale, delta: 3, reason: 宽民}
      hint: 国库 −50，民心 +3

- id: t2_east
  turn: 2
  title: 东都城守
  summary: 东都留守奏洛阳城郭年久失修，留守兵仅万人，多为市井子弟。
  region: duji
  advisors:
    - {character: chen_xilie, stance: neutral, line: 天下太平，东都无警，徐修可也。}
    - {character: feng_changqing, stance: support, line: 城不修、兵不练，有事时便来不及了。}
  options:
    - id: walls
      label: 修东都城防
      ops:
        - {op: adjust_region, region: duji, stat: defense, delta: 10}
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 修城}
      hint: 都畿防务 +10，国库 −80
    - id: garrison
      label: 增募东都留守兵
      ops:
        - {op: adjust_army, army: dongdu_army, delta: 8000, reason: 增募}
        - {op: adjust_resource, resource: treasury, delta: -90, reason: 募兵}
        - {op: adjust_resource, resource: fanzhen_power, delta: -1, reason: 内地有兵}
      hint: 东都兵 +8000，国库 −90，外重内轻 −1

# ============================== T3 天宝十载冬 ==============================
- id: t3_an_tribute
  turn: 3
  title: 范阳岁贡
  summary: 安禄山岁贡俘虏、牛羊、珍禽，络绎于道，并上表陈谢恩遇。
  region: fanyang
  advisors:
    - {character: yang_guifei, stance: support, line: 禄山孝顺得很，陛下该好好赏他。}
    - {character: yang_guozhong, stance: oppose, line: 贡物愈多，其心愈不可测。}
    - {character: gao_lishi, stance: neutral, line: 道上的牛羊，老奴看着倒像是在点数。}
  options:
    - id: reward
      label: 优诏答之，回赐金帛
      ops:
        - {op: adjust_resource, resource: treasury, delta: -50, reason: 回赐}
        - {op: adjust_resource, resource: an_ambition, delta: -2, reason: 恩遇}
      hint: 国库 −50，异志（风闻）↓
    - id: plain
      label: 依例收受，不加恩赏
      ops:
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 恩遇稍减}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 恩威有度}
      hint: 君威 +1，异志（风闻）↑
    - id: son
      label: 召其子入京宿卫
      memory: {character: an_lushan, text: 岁贡之后，陛下召我儿入京宿卫}
      ops:
        - {op: adjust_resource, resource: an_ambition, delta: 2, reason: 以子为质}
        - {op: adjust_resource, resource: rebellion_risk, delta: -3, reason: 有所顾忌}
        - {op: set_flag, key: an_son_in_capital, value: true}
      hint: 渔阳鼙鼓 −3，异志（风闻）↑

- id: t3_review
  turn: 3
  title: 岁末考课
  summary: 吏部、御史台奏岁末考课，诸州刺史多有贪墨不职者，请加黜陟。
  region: jingji
  advisors:
    - {character: yan_zhenqing, stance: support, line: 考课不严，则吏不畏法。请黜其尤者以儆百官。}
    - {character: li_linfu, stance: oppose, line: 陛下圣明。然州郡多事，臣恐骤加黜陟，人人自危。}
  options:
    - id: strict
      label: 严加黜陟
      ops:
        - {op: adjust_resource, resource: corruption, delta: -3, reason: 黜贪}
        - {op: adjust_resource, resource: authority, delta: 1, reason: 赏罚分明}
        - {op: adjust_resource, resource: court_strife, delta: 2, reason: 权门不安}
      hint: 积弊 −3，君威 +1，朝争 +2
    - id: lenient
      label: 依例考课，不另究
      ops:
        - {op: adjust_resource, resource: court_strife, delta: -1, reason: 相安无事}
        - {op: adjust_resource, resource: corruption, delta: 1, reason: 因循}
      hint: 朝争 −1，积弊 +1

- id: t3_winter
  turn: 3
  title: 边军冬衣
  summary: 诸镇请冬衣、赏赐。度支请按旧额支给，或减其半以充左藏。
  region: jingji
  advisors:
    - {character: yang_guozhong, stance: oppose, line: 边费岁增，减其半亦足御寒。}
    - {character: geshu_han, stance: support, line: 士卒冻馁，谁肯卖命？}
  options:
    - id: full
      label: 按旧额支给，并加赏赐
      ops:
        - {op: adjust_resource, resource: treasury, delta: -70, reason: 冬衣赏赐}
        - {op: adjust_resource, resource: frontier_pressure, delta: -3, reason: 边军用命}
      hint: 国库 −70，边患 −3
    - id: half
      label: 减其半
      ops:
        - {op: adjust_resource, resource: treasury, delta: 40, reason: 节省}
        - {op: adjust_resource, resource: frontier_pressure, delta: 2, reason: 边军怨望}
      hint: 国库 +40，边患 +2
    - id: direct
      label: 由朝廷遣使直接颁给士卒
      ops:
        - {op: adjust_resource, resource: treasury, delta: -80, reason: 遣使颁赐}
        - {op: adjust_resource, resource: fanzhen_power, delta: -2, reason: 恩出朝廷}
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 恩不由帅}
      hint: 国库 −80，外重内轻 −2，异志（风闻）↑

# ============================== 常设条目（按条件出现） ==============================
- id: p_gaoqing
  conditions:
    all:
      - {kind: turn, operator: gte, value: 2}
      - {kind: character_status, operator: eq, character: yan_gaoqing, value: alive}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  title: 范阳幕中之人
  summary: 颜真卿言其从兄颜杲卿在范阳幕府，忠义可托。可遣密使通问，以知范阳虚实。
