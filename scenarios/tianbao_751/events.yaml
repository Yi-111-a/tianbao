    - {op: set_army_commander, army: hedong_army, character: null}
    - {op: move_army, army: hedong_army, to_region: hebei, with_commander: false}
    - {op: set_flag, key: hedong_defected, value: true}
    - {op: set_flag, key: hedong_army_rebel, value: true}
