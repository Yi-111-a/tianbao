      - {kind: character_status, operator: eq, character: li_guangbi, value: alive}
  gravity: 1.0
  text: 范阳兵变，李光弼自乱军中脱身，走河东。
  effects:
    - {op: move_character, character: li_guangbi, to_region: hedong}
