  title: 新帅脱身
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: mutiny_rebellion, value: true}
      - {kind: region_controller, operator: eq, region: fanyang, faction: yan}
      - {kind: character_region, operator: eq, character: gao_xianzhi, region: fanyang}
      - {kind: character_status, operator: eq, character: gao_xianzhi, value: alive}
  gravity: 1.0
  text: 范阳兵变，高仙芝自乱军中脱身，走河东。
  effects:
    - {op: move_character, character: gao_xianzhi, to_region: hedong}
  illustration: event.fanyang_uprising

- id: mutiny_flee_guo
  title: 新帅脱身
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: mutiny_rebellion, value: true}
      - {kind: region_controller, operator: eq, region: fanyang, faction: yan}
      - {kind: character_region, operator: eq, character: guo_ziyi, region: fanyang}
      - {kind: character_status, operator: eq, character: guo_ziyi, value: alive}
  gravity: 1.0
  text: 范阳兵变，郭子仪自乱军中脱身，走河东。
  effects:
    - {op: move_character, character: guo_ziyi, to_region: hedong}
  illustration: event.fanyang_uprising

