# ---- 乱平：叛军覆灭，或范阳收复且首逆就擒、余众不足两万。转入善后（奏疏 s_*），战时奏疏收起。 ----
- id: rebellion_quelled
  title: 叛乱平定
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: rebellion_started, value: true}
      - {not: {kind: flag, operator: eq, key: rebellion_quelled, value: true}}
      - {not: {kind: flag, operator: eq, key: tongguan_lost, value: true}}
      - any:
          - {kind: army_strength, faction: yan, operator: lte, value: 0}
          - all:
              - {kind: region_controller, operator: eq, region: fanyang, faction: tang}
              - {kind: army_strength, faction: yan, operator: lte, value: 20000}
              - any:
                  - all:
                      - {kind: flag, operator: eq, key: mutiny_rebellion, value: true}
                      - {not: {kind: character_status, operator: eq, character: shi_siming, value: alive}}
                  - all:
                      - {not: {kind: flag, operator: eq, key: mutiny_rebellion, value: true}}
                      - {not: {kind: character_status, operator: eq, character: an_lushan, value: alive}}
  gravity: 1.0
  text: 叛军或溃或降，首逆或擒或死，河北州县次第反正。战事既息，朝廷转议善后：复员、抚恤、修复漕运、整顿财政、论功行赏。
  effects:
    - {op: set_flag, key: rebellion_quelled, value: true}
    - {op: adjust_resource, resource: rebellion_risk, delta: -40, reason: 叛乱平定}
    - {op: adjust_resource, resource: authority, delta: 5, reason: 平乱}
    - {op: adjust_resource, resource: morale, delta: 3, reason: 兵戈稍息}
  illustration: event.luoyang_recovered

