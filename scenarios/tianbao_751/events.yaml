      - {kind: character_region, operator: eq, character: an_lushan, region: fanyang}
  gravity: 0.5
  text: 范阳惧祸已极，安禄山不待秋高马肥，仓卒举兵南下。（反事实）
  effects:
    - {op: set_flag, key: rebellion_started, value: true}
    - {op: set_flag, key: fanyang_army_rebel, value: true}
    - {op: set_army_faction, army: fanyang_army, faction: yan}
    - {op: set_region_controller, region: fanyang, faction: yan}
    - {op: set_region_controller, region: hebei, faction: yan}
    - {op: adjust_region, region: hebei, stat: order, delta: -30}
    - {op: adjust_resource, resource: authority, delta: -10, reason: 鼙鼓早鸣}
    - {op: move_army, army: fanyang_army, to_region: hebei}
  illustration: event.fanyang_uprising

- id: pinglu_follows
