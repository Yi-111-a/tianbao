  gravity: 1.0
  text: 范阳兵变，封常清自乱军中脱身，走河东。
  effects:
    - {op: move_character, character: feng_changqing, to_region: hedong}
  illustration: event.fanyang_uprising

- id: li_mi_disaster
  title: 李宓南诏覆没
  kind: scheduled
  when: {turn: 13}
  conditions:
    all:
      - {kind: flag, operator: eq, key: guozhong_in_power, value: true}
      - {kind: flag, operator: eq, key: xier_defeat, value: true}   # 「再讨」须先有西洱河之役
      - {not: {kind: flag, operator: eq, key: nanzhao_peace, value: true}}
      - {not: {kind: flag, operator: eq, key: "memorial:t12_limi", value: deny}}
  gravity: 0.6
  text: 李宓将兵七万再讨南诏，深入粮尽，疫疠大作，全军覆没。国忠隐其败。
  effects:
    - {op: adjust_resource, resource: grain, delta: -200, reason: 南征军资}
    - {op: adjust_resource, resource: morale, delta: -6, reason: 道路怨嗟}
    - {op: adjust_resource, resource: frontier_pressure, delta: 6, reason: 西南再败}
    - {op: adjust_resource, resource: corruption, delta: 2, reason: 讳败}
    - {op: set_flag, key: li_mi_defeat, value: true}
  illustration: event.li_mi_disaster

- id: autumn_rains
  title: 关中霖雨
  kind: scheduled
  when: {turn: 14}
  gravity: 0.6
  text: 自秋徂冬，霖雨不止，关中禾稼多损，物价腾踊。
  effects:
    - {op: adjust_resource, resource: grain, delta: -120, reason: 霖雨伤稼}
    - {op: adjust_resource, resource: morale, delta: -3, reason: 米价腾贵}
    - {op: set_flag, key: autumn_rains, value: true}
    - {op: remember, character: gao_lishi, fact: 霖雨之季，陛下曾问老奴天变之由}
  illustration: event.autumn_rains

- id: xilie_dismissed
  title: 陈希烈罢相
  kind: scheduled
  when: {turn: 14}
  conditions:
    all:
      - {kind: office_holder, operator: eq, office: zuo_xiang, character: chen_xilie}
      - {kind: flag, operator: eq, key: guozhong_in_power, value: true}
  gravity: 0.6
  text: 陈希烈与国忠不协，罢知政事。左相出缺，政事堂唯国忠一人。
  effects:
    - {op: dismiss, character: chen_xilie, office: zuo_xiang}
    - {op: adjust_resource, resource: court_strife, delta: 2, reason: 政事堂唯国忠一人}
  illustration: event.zhengshi_hall

- id: geshu_stroke
  title: 哥舒翰风疾
  kind: scheduled
  when: {turn: 16}
  conditions: {kind: character_status, operator: eq, character: geshu_han, value: alive}
  gravity: 0.7
  text: 哥舒翰得风疾，卧病不能视事。
  effects:
    - {op: adjust_trait, character: geshu_han, trait: ability, delta: -3}
    - {op: set_flag, key: geshu_ill, value: true}
  illustration: event.geshu_an_quarrel

- id: fanjiang_swap
  title: 请以蕃将代汉将
  kind: scheduled
  when: {turn: 16}
  conditions:
    all:
      - {kind: resource, id: rebellion_risk, operator: gte, value: 50}
      - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
      - {kind: character_region, operator: eq, character: an_lushan, region: fanyang}
  gravity: 0.85
  text: 安禄山遣副将何千年入奏，请以蕃将三十二人代汉将。朝中有识者以为必反之兆，请勿许。
  choices:
    - id: approve
      text: 准奏，付中书写告身
      effects:
        - {op: adjust_resource, resource: fanzhen_power, delta: 6, reason: 范阳尽用蕃将}
        - {op: adjust_resource, resource: rebellion_risk, delta: 6, reason: 部曲私属}
        - {op: set_flag, key: fanjiang_swapped, value: true}
    - id: reject
      text: 驳回，汉将留任
      memory: {character: an_lushan, text: 请以蕃将代汉将，朝廷驳回不许}
      effects:
        - {op: adjust_resource, resource: an_ambition, delta: 3, reason: 所请不遂}
        - {op: adjust_resource, resource: rebellion_risk, delta: 2, reason: 猜嫌已见}
  default_choice: approve
