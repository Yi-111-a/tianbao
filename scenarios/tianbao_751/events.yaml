# ======================== 第四幕：渔阳鼙鼓 ========================
- id: fanyang_uprising
  title: 范阳起兵
  kind: scheduled
  when: {turn: 19}
  conditions:
    all:
      - {kind: resource, id: rebellion_risk, operator: gte, value: 60}
