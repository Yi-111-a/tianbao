  gravity: 1.0
  text: 颜杲卿遣家僮间道密奏——兵马：幽州城北锻坊昼夜不息，市马之使四出，兵数逾籍；军心：牙兵、曳落河唯帅命是听，蕃将日见亲任；拒命之迹：朝使所至，诸将先入帅府议定方出；禄山每闻朝中言其反，辄终日不语。（定性军情，不改风闻精度）
