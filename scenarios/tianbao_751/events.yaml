# ======================== 第三幕 754–755：将相交恶 ========================
- id: an_sets_out
  title: 禄山应召入朝
  kind: scheduled
  when: {turn: 10}
  conditions:
    all:
      - {kind: resource, id: rebellion_risk, operator: lt, value: 75}
      - {kind: character_region, operator: eq, character: an_lushan, region: fanyang}
      - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
  gravity: 0.7
  text: 杨国忠屡言禄山必反，请召之以验。诏下，安禄山即日驰驿入朝。
  effects:
    - {op: move_character, character: an_lushan, to_region: jingji}
    - {op: set_flag, key: an_coming, value: true}
    - {op: remember, character: an_lushan, fact: 国忠言我必反，陛下召我入朝以验之}
  illustration: event.an_court_visit

- id: an_court_visit
  title: 禄山华清宫入朝
  kind: scheduled
  when: {turn: 12}
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_coming, value: true}
      - {kind: character_region, operator: eq, character: an_lushan, region: jingji}
  gravity: 1.0
  text: 安禄山谒见于华清宫，自陈为国忠所忌。陛下慰谕之，议加其官。如何处置，在此一季。留京者，范阳由所选之人接任节度（禄山兵柄 −70）；平卢、河东（若兼领）随后一并解去。新帅到镇、安抚旧部满三策后，旧部归心，兵柄归零。范阳诸将多其旧部，史思明素得军心，留京之后须防旧部拒命（届时另有奏疏详陈兵变之险与对策）。
  effects:
    - {op: set_flag, key: an_at_court, value: true}
    - {op: adjust_resource, resource: rebellion_risk, delta: -4, reason: 奉召而至，疑谤稍息}
  # 留京三项只差接任之人；平卢、河东兼职由系统事件 an_stripped_pinglu / an_stripped_hedong 依实际兼领情况解去。
  choices:
    - id: detain
      text: 留京宿卫，解其范阳节度，以高仙芝接任（平卢、河东随后解去）
      conditions:
        all:
          - {kind: character_status, operator: eq, character: gao_xianzhi, value: alive}
          - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
      memory: {character: an_lushan, text: 华清宫入朝，竟被留京，范阳付与高仙芝}
      effects:
        - {op: dismiss, character: an_lushan, office: fanyang_jds}
        - {op: appoint, character: gao_xianzhi, office: fanyang_jds, dispatch: true}   # 实授并启程赴任（兼统fanyang_army）
        - {op: adjust_resource, resource: fanzhen_power, delta: -12, reason: 范阳易帅}
        - {op: adjust_resource, resource: an_ambition, delta: 6, reason: 羁留京师}
        - {op: adjust_resource, resource: rebellion_risk, delta: -10, reason: 首领在朝}
        - {op: adjust_resource, resource: an_command, delta: -70, reason: 解其范阳节度}
        - {op: adjust_resource, resource: court_strife, delta: 4, reason: 朝野哗然}
        - {op: set_flag, key: an_detained, value: true}
    - id: detain_guo
      text: 留京宿卫，解其范阳节度，以郭子仪接任（平卢、河东随后解去）
      conditions:
        all:
          - {kind: character_status, operator: eq, character: guo_ziyi, value: alive}
          - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
      memory: {character: an_lushan, text: 华清宫入朝，竟被留京，范阳付与郭子仪}
      effects:
        - {op: dismiss, character: an_lushan, office: fanyang_jds}
        - {op: appoint, character: guo_ziyi, office: fanyang_jds, dispatch: true}   # 实授并启程赴任（兼统fanyang_army）
        - {op: adjust_resource, resource: fanzhen_power, delta: -12, reason: 范阳易帅}
        - {op: adjust_resource, resource: an_ambition, delta: 6, reason: 羁留京师}
        - {op: adjust_resource, resource: rebellion_risk, delta: -10, reason: 首领在朝}
        - {op: adjust_resource, resource: an_command, delta: -70, reason: 解其范阳节度}
        - {op: adjust_resource, resource: court_strife, delta: 4, reason: 朝野哗然}
        - {op: set_flag, key: an_detained, value: true}
    - id: detain_feng
      text: 留京宿卫，解其范阳节度，以封常清接任（平卢、河东随后解去）
      conditions:
        all:
          - {kind: character_status, operator: eq, character: feng_changqing, value: alive}
          - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
      memory: {character: an_lushan, text: 华清宫入朝，竟被留京，范阳付与封常清}
      effects:
        - {op: dismiss, character: an_lushan, office: fanyang_jds}
        - {op: appoint, character: feng_changqing, office: fanyang_jds, dispatch: true}   # 实授并启程赴任（兼统fanyang_army）
        - {op: adjust_resource, resource: fanzhen_power, delta: -12, reason: 范阳易帅}
        - {op: adjust_resource, resource: an_ambition, delta: 6, reason: 羁留京师}
        - {op: adjust_resource, resource: rebellion_risk, delta: -10, reason: 首领在朝}
        - {op: adjust_resource, resource: an_command, delta: -70, reason: 解其范阳节度}
        - {op: adjust_resource, resource: court_strife, delta: 4, reason: 朝野哗然}
        - {op: set_flag, key: an_detained, value: true}
    - id: release
      text: 纵其归镇
      memory: {character: an_lushan, text: 华清宫入朝，陛下慰谕之后放我归镇}
      effects:
        - {op: adjust_resource, resource: an_ambition, delta: 1, reason: 疑惧未解}
    - id: honor
      text: 加左仆射，厚赐遣还
      memory: {character: an_lushan, text: 华清宫入朝，陛下加我左仆射，厚赐遣还}
      effects:
        - {op: adjust_resource, resource: an_ambition, delta: -4, reason: 恩赐优渥}
        - {op: adjust_resource, resource: treasury, delta: -120, reason: 厚赐}
        - {op: adjust_resource, resource: fanzhen_power, delta: 3, reason: 宠任益隆}
        - {op: set_flag, key: an_honored, value: true}
  default_choice: release
  choice_deadline: 1
  illustration: event.an_court_visit

- id: an_flees_back
  title: 禄山疾驰归范阳
  kind: conditional
  conditions:
    all:
      - {kind: turn, operator: gte, value: 13}
      - {kind: flag, operator: eq, key: an_at_court, value: true}
      - {kind: character_region, operator: eq, character: an_lushan, region: jingji}
      - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
  gravity: 0.8
  text: 安禄山辞归，出关即疾驰而去，若恐追还。
  effects:
    - {op: move_character, character: an_lushan, to_region: fanyang}
    - {op: adjust_resource, resource: rebellion_risk, delta: 3, reason: 归心似箭}
  illustration: event.an_gallops_away

# ---- 禄山留京之后（反事实）：兼职解除、择帅、旧部兵变之险 ----
# 兵变规则（奏疏 p_fanyang_warn 以白话写明）：禄山留京满一季、异志 ≥ 55 时每季掷一次；
# 安抚之策计入计数器 fanyang_measures（新帅到镇、清偿欠饷、赦免旧部、移兵弹压各 +1，穷治党与 −1）：
#   ≤ 0 策 35%，1 策 20%，2 策 8%，3 策以上不再兵变。
# 通用诏令夺镇（gpt-07）：不经奏疏，以诏令把禄山调入京畿并免其范阳节度（范阳军亦不归其统领）——与留京夺镇是同一局面，
# 一律并入留京路线：设 an_detained，此后平卢 / 河东兼职随后解去（an_stripped_*）、范阳出缺则择帅、旧部不安与兵变之险、
# 三策安抚、新帅到镇、旧部归心兵柄归零，均与奏疏「禄山在京」/ 华清宫入朝的留京选项相同。数值同奏疏 detain 选项。
- id: an_disarmed_by_ops
  title: 禄山留京解镇
  kind: conditional
  conditions:
    all:
      - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
      - {not: {kind: flag, operator: eq, key: an_kept_in_capital, value: true}}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
      - {kind: character_status, operator: eq, character: an_lushan, value: alive}
      - {kind: character_region, operator: eq, character: an_lushan, region: jingji}
      - {not: {kind: office_holder, operator: eq, office: fanyang_jds, character: an_lushan}}
      - {kind: army_commander, army: fanyang_army, operator: ne, character: an_lushan}
  gravity: 1.0
  text: 安禄山身在京师，范阳节度已罢，范阳军不复归其统领——与留京夺镇无异，并入留京之局。（禄山兵柄 −70；平卢、河东若仍兼领，随后一并解去；范阳旧部不安、兵变之险与三策安抚，见奏疏「范阳旧部可虑」；未经召见而夺镇者另有「诸镇自危」）
  effects:
    - {op: set_flag, key: an_detained, value: true}
    - {op: set_flag, key: an_disarmed_by_ops, value: true}
    - {op: adjust_resource, resource: an_command, delta: -70, reason: 留京解其范阳节度}
    - {op: adjust_resource, resource: an_ambition, delta: 8, reason: 夺镇之恨}
    - {op: adjust_resource, resource: rebellion_risk, delta: -10, reason: 首领在朝}
    - {op: adjust_resource, resource: fanzhen_power, delta: -12, reason: 范阳易帅}
    - {op: adjust_resource, resource: court_strife, delta: 4, reason: 朝野哗然}
    - {op: remember, character: an_lushan, fact: 我在京师，朝廷罢我范阳节度，范阳兵马不复归我}
  illustration: event.jiedu_appointment

# 先「留京宿卫，不夺其官」（兵柄已 −40），后又以诏令罢其范阳节度：补足至与留京夺镇相同（再 −30）。
- id: an_disarmed_by_ops_kept
  title: 禄山留京解镇
  kind: conditional
  conditions:
    all:
      - {not: {kind: flag, operator: eq, key: an_detained, value: true}}
      - {kind: flag, operator: eq, key: an_kept_in_capital, value: true}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
      - {kind: character_status, operator: eq, character: an_lushan, value: alive}
      - {kind: character_region, operator: eq, character: an_lushan, region: jingji}
      - {not: {kind: office_holder, operator: eq, office: fanyang_jds, character: an_lushan}}
      - {kind: army_commander, army: fanyang_army, operator: ne, character: an_lushan}
  gravity: 1.0
  text: 禄山既留京宿卫，今又罢其范阳节度，范阳军不复归其统领，并入留京夺镇之局。（禄山兵柄再 −30；平卢、河东若仍兼领，随后一并解去；范阳旧部之险与三策安抚，见奏疏「范阳旧部可虑」）
  effects:
    - {op: set_flag, key: an_detained, value: true}
    - {op: set_flag, key: an_disarmed_by_ops, value: true}
    - {op: adjust_resource, resource: an_command, delta: -30, reason: 留京之后又解其范阳节度}
    - {op: adjust_resource, resource: an_ambition, delta: 3, reason: 夺镇之恨}
    - {op: adjust_resource, resource: fanzhen_power, delta: -9, reason: 范阳易帅}
    - {op: adjust_resource, resource: court_strife, delta: 1, reason: 朝野哗然}
    - {op: remember, character: an_lushan, fact: 留京之后，朝廷又罢我范阳节度}
  illustration: event.jiedu_appointment

# 未经召见而夺镇（gpt-06 #12 开局即可留京；gpt-07 以诏令调禄山入京再免官）：禄山既非奉召（p_summon）、亦非应召入朝（an_coming），
# 骤夺其镇，诸镇自危、范阳旧部尤惧。留京路线的兵变之险与三策安抚照旧，另多一层：安抚之策先记 −1（须多行一策），
# 其后两季旧部不能归心、每季约一成五鼓噪之险（fanyang_mutiny_early），异志、朝争上升，君威下降。召而后夺者无此一节。
- id: an_detained_early
  title: 诸镇自危
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_detained, value: true}
      - {not: {kind: flag, operator: eq, key: an_summon_arrived, value: true}}
      - {not: {kind: flag, operator: eq, key: an_coming, value: true}}
      - {not: {kind: flag, operator: eq, key: early_detain_alarm, value: true}}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  gravity: 1.0
  text: 禄山未有反迹，又非奉召入朝，骤被夺镇留京。诸镇节度人人自危，各固其兵；范阳旧部尤惧，史思明等私相约结。（安抚之策 −1，须多行一策；此后两季内旧部不能归心，每季约一成五有鼓噪之险，不论异志高低、安抚几策；异志、朝争上升，君威 −3，外重内轻 +4）
  effects:
    - {op: set_flag, key: early_detain_alarm, value: true}
    - {op: adjust_counter, key: fanyang_measures, delta: -1}
    - {op: adjust_resource, resource: an_ambition, delta: 6, reason: 无罪见夺}
    - {op: adjust_resource, resource: authority, delta: -3, reason: 无故夺镇}
    - {op: adjust_resource, resource: court_strife, delta: 3, reason: 诸镇自危}
    - {op: adjust_resource, resource: fanzhen_power, delta: 4, reason: 诸镇各固其兵}
  illustration: event.fanyang_armoury

- id: an_stripped_pinglu
  title: 解禄山平卢节度
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_detained, value: true}
      - {kind: office_holder, operator: eq, office: pinglu_jds, character: an_lushan}
  gravity: 1.0
  text: 禄山既留京师，平卢节度一并解去，平卢军暂由副将统摄。
  effects:
    - {op: dismiss, character: an_lushan, office: pinglu_jds}
    - {op: set_army_commander, army: pinglu_army, character: null}
    - {op: adjust_resource, resource: an_command, delta: -10, reason: 解平卢节度}
  illustration: event.jiedu_appointment

- id: an_stripped_hedong
  title: 解禄山河东节度
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_detained, value: true}
      - {kind: office_holder, operator: eq, office: hedong_jds, character: an_lushan}
  gravity: 1.0
  text: 禄山既留京师，河东节度一并解去，河东兵马改隶朝廷。
  effects:
    - {op: dismiss, character: an_lushan, office: hedong_jds}
    - {op: set_army_commander, army: hedong_army, character: null}
    - {op: adjust_resource, resource: an_command, delta: -10, reason: 解河东节度}
    - {op: set_flag, key: hedong_to_an, value: false}
    - {op: set_flag, key: hedong_secured, value: true}
  illustration: event.jiedu_appointment

# 留京而范阳节度仍缺（如奏疏所拟接任者不能赴任）：请旨择帅，人选不可用则不显示。
- id: fanyang_successor
  title: 范阳择帅
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_detained, value: true}
      - {kind: office_holder, operator: eq, office: fanyang_jds, character: null}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  gravity: 1.0
  text: 禄山留京，范阳节度出缺，军中无主。中书请旨择帅；新帅到镇，诸将方有所统。逾期不决，依中书首拟以高仙芝充任。
  choices:
    - id: gao
      text: 以高仙芝为范阳节度使
      conditions: {kind: character_status, operator: eq, character: gao_xianzhi, value: alive}
      effects:
        - {op: appoint, character: gao_xianzhi, office: fanyang_jds, dispatch: true}   # 实授并启程赴任（兼统fanyang_army）
    - id: guo
      text: 以郭子仪为范阳节度使
      conditions: {kind: character_status, operator: eq, character: guo_ziyi, value: alive}
      effects:
        - {op: appoint, character: guo_ziyi, office: fanyang_jds, dispatch: true}   # 实授并启程赴任（兼统fanyang_army）
    - id: li
      text: 以李光弼为范阳节度使
      conditions: {kind: character_status, operator: eq, character: li_guangbi, value: alive}
      effects:
        - {op: appoint, character: li_guangbi, office: fanyang_jds, dispatch: true}   # 实授并启程赴任（兼统fanyang_army）
    - id: feng
      text: 以封常清为范阳节度使
      conditions: {kind: character_status, operator: eq, character: feng_changqing, value: alive}
      effects:
        - {op: appoint, character: feng_changqing, office: fanyang_jds, dispatch: true}   # 实授并启程赴任（兼统fanyang_army）
    - id: deputy
      text: 暂不除节度，由范阳副将知留后（不任命；兵变之险不减）
      effects:
        - {op: adjust_resource, resource: rebellion_risk, delta: 2, reason: 范阳无帅}
  default_choice: gao
  choice_deadline: 1
  illustration: event.jiedu_appointment

