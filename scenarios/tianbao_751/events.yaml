      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
      - {not: {kind: flag, operator: eq, key: fanyang_commander_present, value: true}}
      - any:   # 范阳军新统帅（不论经奏疏、抉择或诏令任命）已到镇
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: gao_xianzhi}
              - {kind: character_region, operator: eq, character: gao_xianzhi, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: guo_ziyi}
              - {kind: character_region, operator: eq, character: guo_ziyi, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: li_guangbi}
              - {kind: character_region, operator: eq, character: li_guangbi, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: feng_changqing}
              - {kind: character_region, operator: eq, character: feng_changqing, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: geshu_han}
              - {kind: character_region, operator: eq, character: geshu_han, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: an_sishun}
              - {kind: character_region, operator: eq, character: an_sishun, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: li_linfu}
              - {kind: character_region, operator: eq, character: li_linfu, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: yang_guozhong}
              - {kind: character_region, operator: eq, character: yang_guozhong, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: chen_xilie}
              - {kind: character_region, operator: eq, character: chen_xilie, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: gao_lishi}
              - {kind: character_region, operator: eq, character: gao_lishi, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: yan_zhenqing}
              - {kind: character_region, operator: eq, character: yan_zhenqing, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: yan_gaoqing}
              - {kind: character_region, operator: eq, character: yan_gaoqing, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: xianyu_zhongtong}
              - {kind: character_region, operator: eq, character: xianyu_zhongtong, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: bian_lingcheng}
              - {kind: character_region, operator: eq, character: bian_lingcheng, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: ji_wen}
              - {kind: character_region, operator: eq, character: ji_wen, region: fanyang}
          - all:
              - {kind: army_commander, army: fanyang_army, operator: eq, character: li_heng}
              - {kind: character_region, operator: eq, character: li_heng, region: fanyang}
  gravity: 1.0
  text: 范阳军新帅到镇，诸将参谒，军中稍定。（安抚之策 +1）
  effects:
    - {op: set_flag, key: fanyang_commander_present, value: true}
    - {op: adjust_counter, key: fanyang_measures, delta: 1}
    - {op: adjust_resource, resource: rebellion_risk, delta: -2, reason: 新帅到镇}
  illustration: event.jiedu_appointment

# 旧部不安：安抚未满三策时，每季渔阳鼙鼓 +2，危机计因之反映兵变之险。
- id: fanyang_unrest
  title: 范阳旧部不安
  kind: system
  repeatable: true
  cooldown: 1
  conditions:
    all:
      - {kind: flag, operator: eq, key: an_detained, value: true}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
      - {kind: counter, key: fanyang_measures, operator: lt, value: 3}
  gravity: 1.0
  text: 范阳旧部私议主帅去留，军中不安。
  effects:
    - {op: adjust_resource, resource: rebellion_risk, delta: 2, reason: 范阳旧部不安}

# 旧部归心（#36）：禄山已解镇（或其人已不在），新帅到镇，安抚之策满三（兵变之险已除）→ 禄山兵柄归零。
# 此后危机计「禄山异志」项为 0，「兵柄已解」每季约 −1.5，渔阳鼙鼓逐季消退；结局可走「天宝中兴·夺镇弭兵」。
- id: fanyang_pacified
  title: 范阳旧部归心
  kind: conditional
  conditions:
    all:
      - any:
          - {kind: flag, operator: eq, key: an_detained, value: true}
          - {not: {kind: character_status, operator: eq, character: an_lushan, value: alive}}
      - {kind: flag, operator: eq, key: fanyang_commander_present, value: true}
      - {kind: counter, key: fanyang_measures, operator: gte, value: 3}
      - {not: {kind: flag, operator: eq, key: fanyang_pacified, value: true}}
      - {not: {kind: flag_age, key: early_detain_alarm, operator: lte, value: 1}}   # 未经召见而夺镇后两季内旧部未能归心
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  gravity: 1.0
  text: 新帅号令已行于范阳：欠饷得清，赦令已下，史思明以下诸将受代参谒，部伍如籍。禄山既去其镇，旧部不复以东平郡王为主。（禄山兵柄归零：渔阳鼙鼓自此逐季消退；安抚已满三策，兵变不再发生）
  effects:
    - {op: set_flag, key: fanyang_pacified, value: true}
    - {op: adjust_resource, resource: an_command, delta: -100, reason: 旧部归心，兵柄尽归朝廷}
    - {op: adjust_resource, resource: rebellion_risk, delta: -3, reason: 范阳旧部归心}
    - {op: remember, character: shi_siming, fact: 新帅到镇，朝廷清偿欠饷、赦免旧部，我等受代参谒}
  illustration: event.jiedu_appointment

# 禄山身故、流放或系狱：其人既不在，兵柄折去大半；旧部仍须安抚（与留京同理）。
- id: an_gone
  title: 禄山失其兵柄
  kind: conditional
  conditions:
    all:
      - {not: {kind: character_status, operator: eq, character: an_lushan, value: alive}}
      - {kind: resource, id: an_command, operator: gt, value: 30}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  gravity: 1.0
  text: 安禄山既不能视事，范阳、平卢诸军无主，暂由副将统摄；旧部去就未定。
  effects:
    - {op: adjust_resource, resource: an_command, delta: -70, reason: 主帅不在}
  illustration: event.jiedu_appointment

- id: fanyang_mutiny
  title: 范阳兵变
  kind: conditional
  conditions:
    all:
      - any:
          - {kind: flag_age, key: an_detained, operator: gte, value: 1}
          - all:
              - {kind: flag_age, key: fanyang_restive, operator: gte, value: 1}
              - {kind: character_region, operator: eq, character: an_lushan, region: jingji}
      - {kind: resource, id: an_ambition, operator: gte, value: 55}
      - {kind: counter, key: fanyang_measures, operator: lte, value: 0}
      - {kind: character_status, operator: eq, character: shi_siming, value: alive}
      - {not: {kind: flag, operator: eq, key: rebellion_started, value: true}}
  gravity: 0.35
  text: 范阳诸将以主帅久留京师，鼓噪不受代，推史思明为帅，声言迎还东平郡王。朝廷未行安抚之策，旧部无所顾忌。（反事实）
  effects:
    - {op: set_flag, key: rebellion_started, value: true}
    - {op: set_flag, key: mutiny_rebellion, value: true}
    - {op: set_flag, key: fanyang_army_rebel, value: true}
    - {op: set_army_faction, army: fanyang_army, faction: yan}
    - {op: set_army_commander, army: fanyang_army, character: shi_siming}
    - {op: adjust_army, army: fanyang_army, delta: -25000, reason: 诸将离心，部伍不全}
    - {op: set_region_controller, region: fanyang, faction: yan}
    - {op: adjust_resource, resource: authority, delta: -6, reason: 边兵哗变}
    - {op: adjust_resource, resource: rebellion_risk, delta: 30, reason: 范阳兵变}
    - {op: move_army, army: fanyang_army, to_region: hebei}
  illustration: event.fanyang_uprising

# 未经召见而夺镇（「诸镇自危」）之后两季：旧部闻变，不论异志高低、安抚几策，每季约一成五鼓噪之险；此两季内旧部不能归心（反事实）。
