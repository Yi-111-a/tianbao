- id: mutiny_flee_feng
  title: 新帅脱身
  kind: conditional
  conditions:
    all:
      - {kind: flag, operator: eq, key: mutiny_rebellion, value: true}
      - {kind: region_controller, operator: eq, region: fanyang, faction: yan}
