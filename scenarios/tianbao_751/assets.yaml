  prompt: 'SUBJECT: Title screen painting. Ink-wash and gold-leaf panorama of Chang''an city at dusk seen from a high terrace of Hanyuan Hall of Daming Palace, vermilion pillars and grey-tiled eaves in
    the foreground at the edges, rows of city wards and grid avenues receding below into evening haze, golden cloud banks, a lone aged emperor in an ochre-yellow robe and a soft folded-top cap seen from
    behind at the far right of the terrace, blooming peonies in the foreground lower right, and on the far northeast horizon one thin ominous column of dark smoke. The entire left third of the image is
    left calm and uncluttered (soft golden clouds and distant rooftops) as an empty space for a title to be added later. No dragons on the robe or railings. Absolutely no text, no characters, no letters,
    no numbers anywhere in the image.'
