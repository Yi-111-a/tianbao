- id: map.base
  kind: map
  used_by: map:base
  path: assets/map/map.base.webp
  size:
  - 2048
  - 1365
  format: webp
  prompt: 'SUBJECT: A full-bleed flat top-down hand-painted silk map of the Tang empire in 751 AD, no perspective, no desk, no frame, painted edge to edge on aged silk. Territory: from the Western Regions
    oasis deserts and the Tianshan edge at far left, the high Tibetan plateau (snowy blue-white mountains, outside the empire) at lower left, the Guanzhong plain and Qinling mountain range in the centre,
    the Taihang mountains running north-south, the Yellow River with its great northern bend, the Yangtze River in the south, the Grand Canal and Bian canal drawn as thin straight waterways joining the
    Yellow River plain to the Yangtze delta, the narrow Tongguan pass gorge where the Yellow River turns east near the centre, northern steppes and the Liaodong forest at the top right, the Sichuan basin
    at lower centre-left, the misty Yunnan highlands at lower left, the southern coast at lower right. The eastern and southern sea is only a plain calm blue-green expanse along the right and bottom edges
    with simple wave scrolls: NO islands, NO Taiwan, NO Japan, NO Korea detail, NO modern coastline emphasis. Mountains painted in azurite blue and malachite green blue-green landscape style, farmland and
    plains in warm ochre and silk-yellow, deserts pale sand, steppes muted olive. Tiny palace and city-wall icons for about ten cities (blank, no labels), small camel caravans in the west, faint dotted
    road lines. Soft cloud and mist wisps in gold leaf at the edges, fading naturally to silk at the borders. NO text, NO labels, NO map legend, NO compass, NO cartouche, NO border lines with writing. Absolutely
    no text, no characters, no letters, no numbers anywhere in the image.'
  negative_prompt: text, characters, calligraphy, letters, numbers, watermark, logo, dragon, dragon robe, Ming wing hat, mandarin square, modern, photo, 3d render, anime
  style_ref: design/STYLE_GUIDE.md §5 shared style block
  model: codex-image
  sha256: 1955dde731c8f1a83522b7720816fa87f25a60c1fa2076cf6edee314836ece8a
  status: generated
  version: 1
