  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const TOTAL = 10.28;

      // ---------- typed command, wrapped to two lines: one span per character ----------
      const LINE1 = "codex mcp add tianbao";
      const LINE2 = "-- tianbao-server mcp";
      const fill = (el, str) => {
        el.textContent = "";
        const out = [];
        for (let i = 0; i < str.length; i++) {
          const s = document.createElement("span");
          s.textContent = str[i] === " " ? " " : str[i];
          el.appendChild(s);
          out.push(s);
        }
        return out;
      };
      const chars1 = fill($("v09-cmd1"), LINE1);
      const chars2 = fill($("v09-cmd2"), LINE2);

      // ---------- camera: multi-phase (steady push → hard push-through) ----------
      const cam = $("v09-cam");
      const C = { x: 540, y: 960 };
      // darkest ink inside the 「天宝」 blot, above 天 (title px ≈ 300,165) → stage coords
      const P = { x: 352 + (300 - 105), y: 64 + (165 - 80) };
      const PUSH_AT = 6.2;
      const PUSH_DUR = 0.46;
      const S_END = 22;
      const eSteady = gsap.parseEase("power1.inOut");
      const ePushS = gsap.parseEase("power3.in");
      // Pure function of time -> order-independent, seek-safe (one writer).
      const writeCam = (t) => {
        let s = 1 + 0.04 * eSteady(Math.min(1, Math.max(0, (t - 0.3) / 5.8))); // steady push
        let k = 0;
        if (t > PUSH_AT) {
          const u = Math.min(1, (t - PUSH_AT) / PUSH_DUR); // hard push-through
          const s0 = s;
          const w = ePushS(u);
          s = s0 + (S_END - s0) * w;
          // coordinate-target zoom: the blot point P glides from its on-screen spot to lens center
          // while scale ramps, so the camera dives INTO the ink (never sweeps across the panel)
          // (P's screen travel is tied to the scale ramp so the stage's top edge never enters the lens)
          k = 1 - ((1 - w) * s0) / s;
        }
        const p = (t / TOTAL) * Math.PI * 2 * 1.5;
        const dx = Math.sin(p) * 2 * (1 - k);
        const dy = Math.sin(p * 1.3) * 4 * (1 - k);
        const fx = C.x + k * (P.x - C.x);
        const fy = C.y + k * (P.y - C.y);
        const tx = C.x - s * fx + dx;
        const ty = C.y - s * fy + dy;
        cam.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      };
      writeCam(0);
      const clock = { t: 0 };
      tl.to(clock, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: () => writeCam(clock.t) }, 0);

      // horizontal motion blur on the push (lens wrapper, un-transformed)
      const blurNode = $("v09-streak-blur");
      const blurProxy = { v: 0 };
      const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.v} 0`);
      writeBlur();
      tl.set($("v09-lens"), { filter: "url(#v09-streak)" }, PUSH_AT);
      tl.to(blurProxy, { v: 20, duration: PUSH_DUR, ease: "power3.in", onUpdate: writeBlur }, PUSH_AT);
      // the blot's ink fills the lens as the camera reaches it
      tl.fromTo("#v09-ink", { opacity: 0 }, { opacity: 0.9, duration: 0.2, ease: "power2.in" }, PUSH_AT + PUSH_DUR - 0.2);
      // cut at peak velocity
      tl.set($("v09-lens"), { opacity: 0 }, PUSH_AT + PUSH_DUR);

      // ---------- Scene 1 (0.0–1.0): mark settles, 「开源免费」 lands ----------
      tl.fromTo("#v09-mark", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(
        "#v09-panel",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        "#v09-l1",
        { opacity: 0, scale: 1.35, y: -20, filter: "blur(10px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", transformOrigin: "0% 50%" },
        0.18,
      );
      tl.fromTo(
        "#v09-seal",
        { opacity: 0, scale: 1.6, rotation: -18 },
        { opacity: 1, scale: 1, rotation: -6, duration: 0.34, ease: "power3.out" },
        0.72,
      );

      // ---------- Scene 2 (1.12–2.5): 「打开网页就能玩」 per-word ----------
      tl.fromTo(
        ".v09-w2",
        { opacity: 0, x: 60, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.22 },
        1.12,
      );

      // ---------- Scene 3 (2.58–5.8): 接入 Codex · Claude Code + terminal ----------
      tl.fromTo(
        ".v09-w3",
        { opacity: 0, x: 60, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.12 },
        2.58,
      );
      tl.fromTo(
        "#v09-term",
        { opacity: 0, y: 24, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "power3.out", transformOrigin: "0% 50%" },
        3.0,
      );
      // typing — line 1, then the wrap, then line 2
      const TYPE_AT = 3.25;
      const STEP = 0.038;
      tl.set("#v09-caret2", { opacity: 0 }, 0);
      chars1.forEach((s, i) => tl.set(s, { display: "inline" }, TYPE_AT + i * STEP));
      const L2_AT = TYPE_AT + chars1.length * STEP + STEP;
      tl.set("#v09-caret1", { opacity: 0 }, L2_AT);
      tl.set("#v09-caret2", { opacity: 1 }, L2_AT);
      chars2.forEach((s, i) => tl.set(s, { display: "inline" }, L2_AT + i * STEP));
      // caret blink after the command lands (stepped, deterministic)
      const typedEnd = L2_AT + chars2.length * STEP;
      let on = true;
      for (let t = typedEnd + 0.3; t < PUSH_AT; t += 0.32) {
        on = !on;
        tl.set("#v09-caret2", { opacity: on ? 1 : 0 }, t);
      }

      // gold glow as each name is spoken
      const glow = (wordId, ulId, at) => {
        tl.fromTo(
          "#" + wordId,
          { textShadow: "0 0 0px rgba(201,162,75,0), 0 0 0px rgba(201,162,75,0)", color: "#17110e" },
          {
            textShadow: "0 0 26px rgba(201,162,75,1), 0 0 8px rgba(201,162,75,0.9)",
            color: "#6e4f12",
            duration: 0.22,
            ease: "power2.out",
          },
          at,
        );
        tl.to(
          "#" + wordId,
          { textShadow: "0 0 0px rgba(201,162,75,0), 0 0 0px rgba(201,162,75,0)", color: "#17110e", duration: 0.5, ease: "power2.inOut" },
          at + 0.42,
        );
        tl.fromTo("#" + ulId, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, at);
      };
      glow("v09-codex", "v09-ul-codex", 3.72);
      glow("v09-claude", "v09-ul-claude", 4.62);

      // ---------- Scene 4 (6.3–10.28): through the blot → the question + URL ----------
      const CUT = PUSH_AT + PUSH_DUR;
      // zoom-through entry: continues forward from the cut (matched blur / direction)
      tl.fromTo(
        "#v09-final-inner",
        { opacity: 0.15, scale: 0.75, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
        CUT,
      );
      tl.fromTo("#v09-final", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, CUT - 0.01);
      tl.fromTo("#v09-datang", { rotation: 0, scale: 1.25 }, { rotation: -4, scale: 1, duration: 0.45, ease: "power3.out" }, 6.86);
      tl.fromTo("#v09-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 7.12);
      // URL wipe-in, left→right with a glowing leading edge
      tl.fromTo(
        "#v09-url",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" },
        6.95,
      );
      tl.fromTo("#v09-edge-track", { xPercent: 0 }, { xPercent: 100, duration: 0.5, ease: "power2.inOut" }, 6.95);
      tl.to("#v09-edge", { opacity: 0, duration: 0.15, ease: "none" }, 7.45);
      // hold still

      // the film's exit — short fade to black
      tl.fromTo("#v09-black", { opacity: 0 }, { opacity: 1, duration: 0.38, ease: "power1.in" }, 9.9);

      window.__timelines["09-cta"] = tl;
    })();
  </script>
