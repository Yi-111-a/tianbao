      // ── one beat array: every slam, cut and shake kick reads from it ──
      const CUT = { s2: 1.25, s3: 2.26, s4: 3.27, s5: 4.35, black: 5.1, s6: 5.22 };

        $("proof"),

      tl.fromTo(
        $("dongdu-txt"),
        { x: -560, rotation: -4, opacity: 0 },
        { x: 0, rotation: -4, opacity: 1, duration: 0.4, ease: "expo.out" },
