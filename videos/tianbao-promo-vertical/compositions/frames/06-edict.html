  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const root = document.querySelector('[data-composition-id="06-edict"]');
      const $ = (id) => root.querySelector("#v06-edict-" + id);

      const DUR = 6.288;
      const CUT1 = 0.76; // 「发政策卡」
      const CUT2 = 1.76; // 「调兵遣将」
      const EXIT = 0.26; // cut-the-curve exit (power4.in)
      const ENTER = 0.34; // cut-the-curve entry (power3.out)
      const PUSH = 260; // same leftward distance both sides of every seam

      // Zoom-to-target (nested wrappers): zo scales about the window center,
      // zi translates by (image center − target); targets are pixel coords on the 1920×1080 screenshots.
      const T = (tx, ty) => ({ x: 960 - tx, y: 540 - ty });

      const tl = gsap.timeline({ paused: true });

      // ---------- initial states ----------
      tl.set($("gate-2"), { autoAlpha: 0 }, 0);
      tl.set($("gate-3"), { autoAlpha: 0 }, 0);
      tl.set([$("chip-2"), $("chip-3")], { opacity: 0 }, 0);
      tl.set([$("pipfill-1"), $("pipfill-2"), $("pipfill-3")], { scaleX: 0 }, 0);
      tl.set($("map"), { opacity: 0, transformOrigin: "0px 0px", scale: 2, x: 0, y: -240 }, 0);
      tl.set($("map-dim"), { opacity: 0 }, 0);
      tl.set([$("card"), $("stamp")], { opacity: 0 }, 0);

      // gates: each surface only exists inside its scene window
      tl.set($("gate-1"), { autoAlpha: 0 }, CUT1);
      tl.set($("gate-2"), { autoAlpha: 1 }, CUT1);
      tl.set($("gate-2"), { autoAlpha: 0 }, CUT2);
      tl.set($("gate-3"), { autoAlpha: 1 }, CUT2);

      // ---------- Scene 1 (0.0–0.76): 拟诏 — the edict scroll rises into the window ----------
      tl.fromTo($("slide-1"), { y: 220 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo($("slide-1"), { opacity: 0.25 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      tl.fromTo($("zo-1"), { scale: 1.16 }, { scale: 1.3, duration: CUT1, ease: "power1.out" }, 0);
      tl.fromTo($("zi-1"), T(960, 530), { ...T(960, 520), duration: CUT1, ease: "power1.out" }, 0);
      tl.fromTo($("chip-1"), { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.fromTo($("pipfill-1"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);

      // seam 1 → push-left (cut the curve)
      tl.to($("slide-1"), { x: -PUSH, duration: EXIT, ease: "power4.in" }, CUT1 - EXIT);
      tl.to($("slide-1"), { opacity: 0, duration: 0.2, ease: "none" }, CUT1 - 0.2);
      tl.to($("chip-1"), { x: -120, duration: EXIT, ease: "power4.in" }, CUT1 - EXIT);
      tl.to($("chip-1"), { opacity: 0, duration: 0.2, ease: "none" }, CUT1 - 0.2);

      // ---------- Scene 2 (0.76–1.76): 发政策卡 — card picker, zoom onto the card grid ----------
      tl.fromTo($("slide-2"), { x: PUSH }, { x: 0, duration: ENTER, ease: "power3.out" }, CUT1);
      tl.fromTo($("slide-2"), { opacity: 0.35 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, CUT1);
      tl.fromTo($("zo-2"), { scale: 1.13 }, { scale: 1.32, duration: 0.72, ease: "power3.inOut" }, 0.86);
      tl.fromTo($("zi-2"), T(980, 545), { ...T(980, 600), duration: 0.72, ease: "power3.inOut" }, 0.86);
      tl.fromTo($("chip-2"), { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, CUT1 + 0.04);
      tl.fromTo($("pipfill-2"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, CUT1 + 0.04);

      // seam 2 → push-left
      tl.to($("slide-2"), { x: -PUSH, duration: EXIT, ease: "power4.in" }, CUT2 - EXIT);
      tl.to($("slide-2"), { opacity: 0, duration: 0.2, ease: "none" }, CUT2 - 0.2);
      tl.to($("chip-2"), { x: -120, duration: EXIT, ease: "power4.in" }, CUT2 - EXIT);
      tl.to($("chip-2"), { opacity: 0, duration: 0.2, ease: "none" }, CUT2 - 0.2);

      // ---------- Scene 3 (1.76–2.9): 调兵遣将 — 兵部 panel, zoom onto the army list ----------
      tl.fromTo($("slide-3"), { x: PUSH }, { x: 0, duration: ENTER, ease: "power3.out" }, CUT2);
      tl.fromTo($("slide-3"), { opacity: 0.35 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, CUT2);
      // list column x 22–470; 1.5× view (x 0–627, y 90–890) stays inside the image
      tl.fromTo($("zo-3"), { scale: 1.12 }, { scale: 1.5, duration: 0.95, ease: "power3.inOut" }, 1.9);
      tl.fromTo($("zi-3"), T(420, 540), { ...T(313, 490), duration: 0.95, ease: "power3.inOut" }, 1.9);
      tl.fromTo($("chip-3"), { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, CUT2 + 0.04);
      tl.fromTo($("pipfill-3"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, CUT2 + 0.04);

      // seam 3 → the whole stage pushes left and gives way to the map (internal scene seam)
      tl.to($("stage"), { x: -PUSH, duration: 0.3, ease: "power4.in" }, 3.0);
      tl.to($("stage"), { opacity: 0, duration: 0.22, ease: "none" }, 3.08);

      // ---------- Scene 4 (3.25–6.288): 千里之外 — map + route; 军令要走好几季 — receipt + 需 4 季 ----------
      tl.to($("map"), { opacity: 1, duration: 0.55, ease: "power1.out" }, 3.12);
      tl.to($("map-dim"), { opacity: 0.4, duration: 0.55, ease: "power1.out" }, 3.12);
      // cover-crop camera (2× map, top HUD cropped): 京畿 + 潼关 in view → travels in lockstep with the pen (same timing + ease) to 范阳, then holds
      tl.fromTo($("map"), { x: 0 }, { x: -1580, duration: 1.1, ease: "power2.inOut" }, 3.46);

      // svg-path-draw: a measured solid reveal stroke inside a mask uncovers the dashed route
      const reveal = $("route-reveal");
      const len = reveal.getTotalLength() * 1.02;
      reveal.style.strokeDasharray = String(len);
      reveal.style.strokeDashoffset = String(len);
      tl.fromTo($("route-start"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "power2.out" }, 3.36);
      tl.fromTo(reveal, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, 3.46);
      tl.fromTo($("route-end"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 4.46);
      tl.fromTo($("route-end-dot"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "power2.out" }, 4.46);

      // receipt drops in as a card in the lower-middle
      tl.fromTo($("card"), { y: -110 }, { y: 0, duration: 0.55, ease: "power3.out" }, 4.3);
      tl.to($("card"), { opacity: 1, duration: 0.25, ease: "power1.out" }, 4.3);
      // zoom-to-target inside the card: receipt list overview → the 兴工「禁军整训」4 季 row (施行)
      // card window 900×440; overview 0.86× @ (982, 590) → 2.2× @ (670, 800)
      tl.fromTo($("zo-card"), { scale: 0.86 }, { scale: 2.2, duration: 0.85, ease: "power3.inOut" }, 4.72);
      tl.fromTo($("zi-card"), T(982, 590), { ...T(670, 800), duration: 0.85, ease: "power3.inOut" }, 4.72);

      // 需 4 季 stamp lands beside the 4-season row, then holds
      tl.fromTo($("stamp"), { scale: 1.6 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 5.58);
      tl.to($("stamp"), { opacity: 1, duration: 0.16, ease: "power1.out" }, 5.58);

      // pad the timeline to the fixed frame duration
      tl.to({}, { duration: DUR }, 0);

      window.__timelines["06-edict"] = tl;
    })();
  </script>
