    #v02-lower {

    /* Vermilion tag on the upper card's lower edge — a stage child outside the

    #v02-tag {

      top: 836px; /* centre y 880 = upper card's lower edge */
      width: 440px;

  </style>

  <div id="root" data-composition-id="02-choice" data-width="1080" data-height="1920" data-duration="7.056">

    </div>

    <div id="v02-stage" class="clip" data-start="0" data-duration="7.056" data-track-index="2">
      <!-- DOM order = stacking: upper card first, lower card on top -->
      <div id="v02-upper">
        <div id="v02-upper-inner">
          <img src="assets/ending.e4_history.webp" alt="雨夜栈道，车驾西幸" />

      <!-- Tag sits between the cards in DOM order: never tilted, and the

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector('[data-composition-id="02-choice"] ' + s);
      const qa = (s) => document.querySelectorAll('[data-composition-id="02-choice"] ' + s);

      // ---------- Scene 1 (0.0–1.0s): per-word reveal, content-sequenced ----------
      // dynamic-content-sequencing: pre-compute each word's start from its length.
      const WORDS = Array.prototype.slice.call(qa(".v02-word"));
      const BASE = 0.14;
      const SEC_PER_CHAR = 0.06;
      let cursor = 0.08;
      const SEQ = WORDS.map((el) => {
        const start = cursor;
        cursor += BASE + el.textContent.length * SEC_PER_CHAR;
        return { el: el, start: start };
      });
      SEQ.forEach((w, i) => {
        const last = i === SEQ.length - 1;
        tl.fromTo(
          w.el,
          { opacity: 0, y: 46, scale: last ? 1.4 : 1 },
          { opacity: 1, y: 0, scale: 1, duration: last ? 0.4 : 0.42, ease: "power3.out" },
          w.start,
        );
      });

      // Headline: −2° poster tilt from the start, then rises + shrinks to clear the cards.
      tl.fromTo(
        q("#v02-headline"),
        { y: 0, scale: 1, rotation: -2 },
        { y: -85, scale: 0.62, rotation: -2, duration: 0.75, ease: "power3.out" },
        1.14,
      );

      // ---------- Scene 2 (1.14–2.9s): upper card swings in from the top-left ----------
      // split-tilt-cards rotated for portrait: inner edges recede (book spread),
      // upper faces down-right (rotX −, rotY +), lower faces up-left (rotX +, rotY −).
      const TX = 14;
      const TY = 6;
      const OVER = 8;
      tl.fromTo(
        q("#v02-upper"),
        { x: -560, y: -40, rotationX: -(TX + OVER), rotationY: TY + 12, scale: 0.85, opacity: 0 },
        { x: 0, y: 0, rotationX: -TX, rotationY: TY, scale: 1, opacity: 1, duration: 0.95, ease: "power3.out" },
        1.14,
      );
      // Vermilion tag lands on the card's lower edge (smooth settle, no overshoot).
      tl.fromTo(
        q("#v02-tag"),
        { opacity: 0, y: 24, scale: 0.7, rotation: -2 },
        { opacity: 1, y: 0, scale: 1, rotation: -2, duration: 0.5, ease: "power3.out" },
        1.72,
      );
      // Idle float on the inner layer (explicit tweens, no repeat/yoyo) — counter-phase to the lower card.
      tl.fromTo(q("#v02-upper-inner"), { y: 0 }, { y: -6, duration: 1.2, ease: "sine.inOut" }, 2.1);
      tl.to(q("#v02-upper-inner"), { y: 3, duration: 1.24, ease: "sine.inOut" }, 3.3);

      // ---------- Scene 3 (3.0–4.5s): lower card swings in from the bottom-right ----------
      const S0 = 1 / 3; // split scale → 960×640 apparent (slightly larger than the upper card)
      const LX = 510; // card centre: frame x 30 → 540
      const LY = 300; // card centre: frame y 960 → 1260 (apparent y 940–1580)
      tl.fromTo(
        q("#v02-lower"),
        { x: LX + 560, y: LY + 40, rotationX: TX + OVER, rotationY: -(TY + 12), scale: S0 * 0.85, opacity: 0 },
        { x: LX, y: LY, rotationX: TX, rotationY: -TY, scale: S0, opacity: 1, duration: 0.95, ease: "power3.out" },
        3.0,
      );
      // 励精图治 lands on the card, then the gold hairline draws under it.
      tl.fromTo(
        q("#v02-old-title"),
        { opacity: 0, y: -90, scale: 1.25 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        3.42,
      );
      tl.fromTo(q("#v02-old-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 3.82);
      // Counter-phase idle on the lower inner layer (pre-scale units, ≈4px apparent).
      tl.fromTo(q("#v02-lower-inner"), { y: 0 }, { y: 12, duration: 0.6, ease: "sine.inOut" }, 3.94);

      // ---------- Scene 4 (4.54–6.456s): lower card flattens + expands to full frame ----------
      const M0 = 4.54;
      const MD = 1.0;
      // card-morph-anchor: one tween — uniform scale + flatten + recentre.
      tl.to(
        q("#v02-lower"),
        { x: 0, y: 0, rotationX: 0, rotationY: 0, scale: 1, duration: MD, ease: "power2.inOut" },
        M0,
      );
      tl.to(
        q("#v02-lower-inner"),
        { y: 0, borderColor: "rgba(201,162,75,0)", duration: MD, ease: "power2.inOut" },
        M0,
      );
      // Headline is swallowed by the expanding painting.
      tl.to(q("#v02-headline"), { opacity: 0, duration: 0.45, ease: "power1.in" }, M0);
      // Upper card + its tag slide out toward the top-left wing they came from.
      tl.to(
        q("#v02-upper"),
        { x: -300, y: -720, rotationX: -(TX + 16), opacity: 0, duration: 0.75, ease: "power2.in" },
        M0,
      );
      tl.to(q("#v02-tag"), { x: -300, y: -720, opacity: 0, duration: 0.7, ease: "power2.in" }, M0);
      // Old content out in the first ~40% of the morph.
      tl.to(q("#v02-old"), { opacity: 0, duration: MD * 0.4, ease: "power1.in" }, M0);
      // New content in over the last ~40%.
      tl.fromTo(q("#v02-new"), { opacity: 0 }, { opacity: 1, duration: MD * 0.4, ease: "power1.out" }, M0 + MD * 0.6);
      tl.fromTo(
        q("#v02-new-title"),
        { y: 34, scale: 1.1, rotation: -3 },
        { y: 0, scale: 1, rotation: -3, duration: 0.8, ease: "power3.out" },
        M0 + MD * 0.6,
      );
      // Gold hairlines draw out across the band, then hold.
      tl.fromTo(
        qa(".v02-band-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.out", stagger: 0.08 },
        M0 + MD * 0.7,
      );

      // Pad to the fixed duration (static hold).
      tl.set({}, {}, 6.456);

      window.__timelines["02-choice"] = tl;
    })();
  </script>
