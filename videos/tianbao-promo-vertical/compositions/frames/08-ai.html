    (function () {

      const tl = gsap.timeline({ paused: true });
      const DUR = 7.368;

      // ───────── Scene 1 (0.0–2.7s): light returns, 召对 window rises, 「AI 驱动」 types ─────────
      tl.fromTo("#v08-veil", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.out" }, 0);
      tl.fromTo("#v08-glow1", { opacity: 0, scale: 0.85 }, { opacity: 0.2, scale: 1, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo(
        "#v08-win-rise",
        { opacity: 0, y: 80, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        0
      );
      tl.fromTo("#v08-tag-audience", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.45);
      // slow drift on the An Lushan crop inside its window (clipped; the reply bubble stays still and legible)
      tl.fromTo("#v08-face-img", { scale: 1 }, { scale: 1.06, duration: 3.29, ease: "none" }, 0);

      // lacquer label panel snaps open, then 「AI 驱动」 types with a caret (discrete-text-sequence)
      tl.fromTo("#v08-lab-panel", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, 0.5);
      const SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.7, text: "A" },
        { t: 0.8, text: "AI" },
        { t: 0.92, text: "AI " },
        { t: 1.12, text: "AI 驱" },
        { t: 1.34, text: "AI 驱动" },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      const textEl = document.getElementById("v08-lab-text");
      const caretEl = document.getElementById("v08-caret");
      const TYPE_TOTAL = 2.6;
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: TYPE_TOTAL,
          duration: TYPE_TOTAL,
          ease: "none",
          onUpdate: () => {
            textEl.textContent = textAt(driver.t);
          },
        },
        0
      );
      // caret blink: deterministic square wave, retired once the line has settled
      const BLINK_START = 0.5;
      const BLINK_DUR = 2.3;
      const BLINK_CYCLES = 3.5;
      const blink = { p: 0 };
      tl.fromTo(
        blink,
        { p: 0 },
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: BLINK_DUR,
          ease: "none",
          immediateRender: false,
          onUpdate: () => {
            caretEl.style.opacity = Math.cos(blink.p) > 0 ? "1" : "0";
          },
        },
        BLINK_START
      );
      tl.set(caretEl, { opacity: 0 }, 0);
      tl.set(caretEl, { opacity: 0 }, BLINK_START + BLINK_DUR);

      // ───────── Scene 2 (3.29–5.4s): reply yields up into the header, three speech cards fan in ─────────
      const S2 = 3.29;
      // weight-transfer slide: the 召对 window slides up-right and shrinks into the header row (x 611–1020, y 76–400)

      tl.to("#v08-glow1", { opacity: 0.1, duration: 0.75, ease: "power2.inOut" }, S2);
      // the 「AI 驱动」 label tightens to share the header row
      tl.to("#v08-lab-pos", { y: -40, scale: 0.74, duration: 0.75, ease: "power3.inOut" }, S2);

      tl.fromTo("#v08-tag-debate", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.72);
      const cards = [
        { id: "#v08-card1", rot: -1.2, dx: -10, at: 3.58 },
        { id: "#v08-card2", rot: 1.2, dx: 10, at: 3.9 },
        { id: "#v08-card3", rot: -1.2, dx: -10, at: 4.22 },
      ];
      cards.forEach((c) => {
        tl.fromTo(
          c.id,
          { opacity: 0, x: 300, y: 60, rotation: c.rot + 10, scale: 0.9 },
          { opacity: 1, x: c.dx, y: 0, rotation: c.rot, scale: 1, duration: 0.6, ease: "power3.out" },
          c.at
        );
      });

      tl.fromTo("#v08-chip", { opacity: 0, y: 18, scaleX: 0.6 }, { opacity: 1, y: 0, scaleX: 1, duration: 0.4, ease: "power3.out" }, 4.7);

      // ───────── Scene 3 (5.57–7.368s): everything clears, good ending blooms, two cards re-stack, ticks ─────────
      const S3 = 5.57;
      // zoom-through clear: Z-scale toward camera + blur + fade
      tl.to("#v08-s12", { opacity: 0, scale: 1.07, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, S3);

      // the painting blooms full-frame (cover-crop), settling inward — done before the hold
      tl.fromTo("#v08-glow2", { opacity: 0, scale: 0.85 }, { opacity: 0.3, scale: 1, duration: 0.6, ease: "power2.out" }, S3);
      tl.fromTo(
        "#v08-bloom",
        { opacity: 0, scale: 1.08, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
        S3 + 0.04
      );
      tl.fromTo("#v08-dim", { opacity: 0 }, { opacity: 0.5, duration: 0.45, ease: "power2.out" }, 5.8);

      // parchment title card 「天宝中兴·夺镇弭兵」 rises into the upper half and stays put to the end
      tl.fromTo(
        "#v08-title",
        { opacity: 0, y: 60, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        5.78
      );
      // review card's 目标 rows + 关键数值 below it
      tl.fromTo(
        "#v08-rev",
        { opacity: 0, y: 60, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        5.92
      );

      // three 「达成」 rows: gold band sweeps, seal settles, tick draws — in sequence; last lands by ~6.9s
      [1, 2, 3].forEach((n, i) => {
        const at = 6.36 + i * 0.14;
        tl.fromTo("#v08-band" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.out" }, at);
        tl.fromTo("#v08-seal" + n, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power3.out" }, at);
        tl.fromTo("#v08-tick" + n, { strokeDashoffset: 20 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, at + 0.08);
      });

      // hold to the end of the frame (no exit — the root transition owns it)
      tl.set({}, {}, DUR);

      window.__timelines["08-ai"] = tl;
    })();
  </script>
