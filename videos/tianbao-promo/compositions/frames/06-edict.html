  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const root = document.querySelector('[data-composition-id="06-edict"]');
      const $ = (id) => root.querySelector('[id="f06-edict-' + id + '"]');

      const DUR = 6.288;
      const CUT1 = 0.76; // 「发政策卡」
      const CUT2 = 1.76; // 「调兵遣将」
      const EXIT = 0.26; // cut-the-curve exit (power4.in)
      const ENTER = 0.34; // cut-the-curve entry (power4.out)
      const PUSH = 300; // same leftward distance both sides of every seam

      // Zoom-to-target (nested wrappers): outer scales around window center,
      // inner translates by T = -offset, offset = target − image center (960, 540).
      // Targets are pixel coordinates read off the 1920×1080 screenshots.
      const T = (tx, ty) => ({ x: 960 - tx, y: 540 - ty });

      const tl = gsap.timeline({ paused: true });

      // ---------- gates: each surface only exists inside its scene window ----------
      tl.set($("gate-2"), { autoAlpha: 0 }, 0);
      tl.set($("gate-3"), { autoAlpha: 0 }, 0);
      tl.set($("gate-1"), { autoAlpha: 0 }, CUT1);
      tl.set($("gate-2"), { autoAlpha: 1 }, CUT1);
      tl.set($("gate-2"), { autoAlpha: 0 }, CUT2);
      tl.set($("gate-3"), { autoAlpha: 1 }, CUT2);

      // ---------- Scene 1 (0.0–0.76): 拟诏 — edict scroll rises into the gold frame ----------
      tl.fromTo($("slide-1"), { y: 150 }, { y: 0, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo($("slide-1"), { opacity: 0.25 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      // slow push toward the scroll body (target = scroll center)
      tl.fromTo($("zo-1"), { scale: 0.9 }, { scale: 1.02, duration: CUT1, ease: "power1.out" }, 0);
      tl.fromTo($("zi-s1"), T(982, 540), { ...T(982, 520), duration: CUT1, ease: "power1.out" }, 0);
      // chip 拟诏
      tl.fromTo($("chip-1"), { x: 120 }, { x: 0, duration: 0.45, ease: "power4.out" }, 0.12);
      tl.fromTo($("chip-1"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.12);

      // seam 1 → push-left (cut the curve)
      tl.to($("slide-1"), { x: -PUSH, duration: EXIT, ease: "power4.in" }, CUT1 - EXIT);
      tl.to($("slide-1"), { opacity: 0, duration: 0.2, ease: "none" }, CUT1 - 0.2);
      tl.to($("chip-1"), { x: -120, duration: EXIT, ease: "power4.in" }, CUT1 - EXIT);
      tl.to($("chip-1"), { opacity: 0, duration: 0.2, ease: "none" }, CUT1 - 0.2);

      // ---------- Scene 2 (0.76–1.76): 发政策卡 — card picker, zoom-to-target on the card grid ----------
      tl.fromTo($("slide-2"), { x: PUSH }, { x: 0, duration: ENTER, ease: "power4.out" }, CUT1);
      tl.fromTo($("slide-2"), { opacity: 0.35 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, CUT1);
      // grid bbox ≈ (493–1468, 343–840) → center (980, 592); headroom cap → 1.28×
      tl.fromTo($("zo-2"), { scale: 0.9 }, { scale: 1.28, duration: 0.72, ease: "power3.inOut" }, 0.86);
      tl.fromTo($("zi-s2"), T(982, 560), { ...T(980, 592), duration: 0.72, ease: "power3.inOut" }, 0.86);
      tl.fromTo($("chip-2"), { x: 120 }, { x: 0, duration: 0.4, ease: "power4.out" }, CUT1 + 0.04);
      tl.fromTo($("chip-2"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, CUT1 + 0.04);

      // seam 2 → push-left
      tl.to($("slide-2"), { x: -PUSH, duration: EXIT, ease: "power4.in" }, CUT2 - EXIT);
      tl.to($("slide-2"), { opacity: 0, duration: 0.2, ease: "none" }, CUT2 - 0.2);
      tl.to($("chip-2"), { x: -120, duration: EXIT, ease: "power4.in" }, CUT2 - EXIT);
      tl.to($("chip-2"), { opacity: 0, duration: 0.2, ease: "none" }, CUT2 - 0.2);

      // ---------- Scene 3 (1.76–2.9): 调兵遣将 — 兵部 panel, zoom onto the army list ----------
      tl.fromTo($("slide-3"), { x: PUSH }, { x: 0, duration: ENTER, ease: "power4.out" }, CUT2);
      tl.fromTo($("slide-3"), { opacity: 0.35 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, CUT2);
      // list column x 42–443; target clamped so the 1.5× view (x 0–960, y 130–670) stays inside the image
      tl.fromTo($("zo-3"), { scale: 0.8 }, { scale: 1.5, duration: 0.95, ease: "power3.inOut" }, 1.92);
      tl.fromTo($("zi-s3"), T(960, 540), { ...T(480, 400), duration: 0.95, ease: "power3.inOut" }, 1.92);
      tl.fromTo($("chip-3"), { x: 120 }, { x: 0, duration: 0.4, ease: "power4.out" }, CUT2 + 0.04);
      tl.fromTo($("chip-3"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, CUT2 + 0.04);

      // seam 3 → the whole stage pushes left and gives way to the map (internal scene seam)
      tl.to($("stage"), { x: -PUSH, duration: 0.3, ease: "power4.in" }, 3.0);
      tl.to($("stage"), { opacity: 0, duration: 0.22, ease: "none" }, 3.08);

      // ---------- Scene 4 (3.25–6.288): 千里之外 — map + route; 军令要走好几季 — receipt + 需 4 季 ----------
      tl.fromTo($("map"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 3.12);
      tl.fromTo($("map"), { scale: 1.0 }, { scale: 1.04, duration: DUR - 3.12, ease: "none" }, 3.12);

      // svg-path-draw: a measured solid reveal stroke inside a mask uncovers the dashed route
      const reveal = $("route-reveal");
      const len = reveal.getTotalLength() * 1.02;
      reveal.style.strokeDasharray = String(len);
      reveal.style.strokeDashoffset = String(len);
      tl.fromTo($("route-start"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "power2.out" }, 3.38);
      tl.fromTo(reveal, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.05, ease: "power2.inOut" }, 3.48);
      tl.fromTo($("route-end"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 4.42);
      tl.fromTo($("route-end-dot"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "power2.out" }, 4.42);

      // receipt drops in as a card on the right
      tl.fromTo($("card"), { y: -110 }, { y: 0, duration: 0.55, ease: "expo.out" }, 4.3);
      tl.fromTo($("card"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 4.3);
      // zoom-to-target inside the card: whole scroll → the clause marks of the 「4 季」 row
      // card window 600×600; overview 0.56× @ (982, 544) → 1.25× @ (700, 700)
      tl.fromTo($("zo-card"), { scale: 0.56 }, { scale: 1.25, duration: 0.95, ease: "power3.inOut" }, 4.82);
      tl.fromTo($("zi-card"), T(982, 544), { ...T(700, 700), duration: 0.95, ease: "power3.inOut" }, 4.82);

      // 需 4 季 stamp lands beside the 4-season clause, then holds
      tl.fromTo($("stamp"), { scale: 1.7 }, { scale: 1, duration: 0.42, ease: "expo.out" }, 5.58);
      tl.fromTo($("stamp"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 5.58);

      // pad the timeline to the fixed frame duration
      tl.to({}, { duration: DUR }, 0);

      window.__timelines["06-edict"] = tl;
    })();
  </script>
