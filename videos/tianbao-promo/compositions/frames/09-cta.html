  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const TOTAL = 10.28;

      // ---------- typed command: one span per character (deterministic reveal) ----------
      const CMD = "codex mcp add tianbao -- tianbao-server mcp";
      const cmdEl = $("cta09-cmd");
      cmdEl.textContent = "";
      const chars = [];
      for (let i = 0; i < CMD.length; i++) {
        const s = document.createElement("span");
        s.textContent = CMD[i] === " " ? " " : CMD[i];
        cmdEl.appendChild(s);
        chars.push(s);
      }

      // ---------- camera: multi-phase (steady push → hard push-through) ----------
      const cam = $("cta09-cam");
      const C = { x: 960, y: 540 };
      const P = { x: 295, y: 150 }; // darkest ink inside the 「天宝」 blot (stage coords)
      const PUSH_AT = 6.2;
      const PUSH_DUR = 0.46;
      const eSteady = gsap.parseEase("power1.inOut");
      const ePushS = gsap.parseEase("power3.in");
      const ePushK = gsap.parseEase("power2.in");
      // Pure function of time -> order-independent, seek-safe (one writer).
      const writeCam = (t) => {
        let s = 1 + 0.04 * eSteady(Math.min(1, Math.max(0, (t - 0.3) / 5.8))); // steady push
        let k = 0;
        if (t > PUSH_AT) {
          const u = Math.min(1, (t - PUSH_AT) / PUSH_DUR); // hard push-through
          s = s + (18 - s) * ePushS(u);
          k = ePushK(u);
        }
        const p = (t / TOTAL) * Math.PI * 2 * 1.5;
        const dx = Math.sin(p) * 4 * (1 - k);
        const dy = Math.sin(p * 1.3) * 2 * (1 - k);
        const fx = C.x + k * (P.x - C.x);
        const fy = C.y + k * (P.y - C.y);
        const tx = C.x - s * fx + dx;
        const ty = C.y - s * fy + dy;
        cam.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      };
      writeCam(0);
      const clock = { t: 0 };
      tl.to(clock, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: () => writeCam(clock.t) }, 0);

      // horizontal motion blur on the push (lens wrapper, un-transformed)
      const blurNode = $("cta09-streak-blur");
      const blurProxy = { v: 0 };
      const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.v} 0`);
      writeBlur();
      tl.set($("cta09-lens"), { filter: "url(#cta09-streak)" }, PUSH_AT);
      tl.to(blurProxy, { v: 20, duration: PUSH_DUR, ease: "power3.in", onUpdate: writeBlur }, PUSH_AT);
      // cut at peak velocity — the blot's ink has filled the lens
      tl.set($("cta09-lens"), { opacity: 0 }, PUSH_AT + PUSH_DUR);

      // ---------- Scene 1 (0.0–1.0): mark settles, 「开源免费」 lands ----------
      tl.fromTo("#cta09-mark", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(
        "#cta09-panel",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        "#cta09-l1",
        { opacity: 0, scale: 1.35, y: -20, filter: "blur(10px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", transformOrigin: "0% 50%" },
        0.18,
      );
      tl.fromTo(
        "#cta09-seal",
        { opacity: 0, scale: 1.7, rotation: -18 },
        { opacity: 1, scale: 1, rotation: -6, duration: 0.32, ease: "back.out(2.2)" },
        0.72,
      );

      // ---------- Scene 2 (1.12–2.5): 「打开网页就能玩」 per-word ----------
      tl.fromTo(
        ".cta09-w2",
        { opacity: 0, x: 60, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.22 },
        1.12,
      );

      // ---------- Scene 3 (2.58–5.8): 接入 Codex · Claude Code + terminal ----------
      tl.fromTo(
        ".cta09-w3",
        { opacity: 0, x: 60, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.12 },
        2.58,
      );
      tl.fromTo(
        "#cta09-term",
        { opacity: 0, y: 24, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "back.out(1.6)", transformOrigin: "0% 50%" },
        3.0,
      );
      // typing
      const TYPE_AT = 3.25;
      const STEP = 0.038;
      chars.forEach((s, i) => tl.set(s, { display: "inline" }, TYPE_AT + i * STEP));
      // caret blink after the command lands (stepped, deterministic)
      const typedEnd = TYPE_AT + chars.length * STEP;
      let on = true;
      for (let t = typedEnd + 0.3; t < PUSH_AT; t += 0.32) {
        on = !on;
        tl.set("#cta09-caret", { opacity: on ? 1 : 0 }, t);
      }

      // gold glow as each name is spoken
      const glow = (wordId, ulId, at) => {
        tl.fromTo(
          "#" + wordId,
          { textShadow: "0 0 0px rgba(201,162,75,0), 0 0 0px rgba(201,162,75,0)", color: "#17110e" },
          {
            textShadow: "0 0 26px rgba(201,162,75,1), 0 0 8px rgba(201,162,75,0.9)",
            color: "#6e4f12",
            duration: 0.22,
            ease: "power2.out",
          },
          at,
        );
        tl.to(
          "#" + wordId,
          { textShadow: "0 0 0px rgba(201,162,75,0), 0 0 0px rgba(201,162,75,0)", color: "#17110e", duration: 0.5, ease: "power2.inOut" },
          at + 0.42,
        );
        tl.fromTo("#" + ulId, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, at);
      };
      glow("cta09-codex", "cta09-ul-codex", 3.72);
      glow("cta09-claude", "cta09-ul-claude", 4.62);

      // ---------- Scene 4 (6.3–8.28): through the blot → the question + URL ----------
      const CUT = PUSH_AT + PUSH_DUR;
      // zoom-through entry: continues forward from the cut (matched blur / direction)
      tl.fromTo(
        "#cta09-final-inner",
        { opacity: 0.15, scale: 0.75, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
        CUT,
      );
      tl.fromTo("#cta09-final", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, CUT - 0.01);
      tl.fromTo("#cta09-datang", { rotation: 0, scale: 1.25 }, { rotation: -4, scale: 1, duration: 0.45, ease: "power3.out" }, 6.86);
      tl.fromTo("#cta09-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 7.12);
      // URL wipe-in, left→right with a glowing leading edge
      tl.fromTo(
        "#cta09-url",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" },
        6.95,
      );
      tl.fromTo(
        "#cta09-edge-track",
        { xPercent: 0 },
        { xPercent: 100, duration: 0.5, ease: "power2.inOut" },
        6.95,
      );
      tl.to("#cta09-edge", { opacity: 0, duration: 0.15, ease: "none" }, 7.45);
      // life in the hold

      // the film's exit — short fade to black
      tl.fromTo("#cta09-black", { opacity: 0 }, { opacity: 1, duration: 0.38, ease: "power1.in" }, 9.9);

      window.__timelines["09-cta"] = tl;
    })();
  </script>
