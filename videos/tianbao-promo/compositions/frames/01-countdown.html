  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "01-countdown";
      var DURATION = 4.8;
      var $ = function (s) { return document.getElementById("f" + ID + "-" + s); };

      // One beat array — every hit reads its time from the voiceover cues.
      var BEATS = {
        year: 0.10,   // 「公元七五一年」
        rule: 2.00,   // 「离安史之乱」
        four: 3.25,   // 「只剩四年」
        nian: 3.62    // 「年」 a beat after the 4
      };

      var cam = $("cam");
      var bg = $("bg");
      var year = $("year");
      var rulePath = $("rule-path");
      var caret = $("caret");
      var four = $("four");
      var nian = $("nian");
      var chars = $("label").getElementsByClassName("f01-countdown-ch");

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.4s): short push toward the smoke on the horizon ──
      tl.fromTo(bg, { scale: 1 }, { scale: 1.07, duration: 1.4, ease: "power2.out" }, 0);

      // 「公元751年」 slam — scale + blur collapse (kinetic-beat-slam hit 1)
      tl.fromTo(
        year,
        { scale: 1.5, filter: "blur(16px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
        BEATS.year
      );

      // ── Scene 2 (2.0–3.1s): vermilion rule draws, label types beneath ──
      var len = 0;
      try { len = rulePath.getTotalLength(); } catch (e) { len = 0; }
      if (!len || !isFinite(len)) len = 720;
      len = len * 1.05;
      tl.fromTo(
        rulePath,
        { strokeDasharray: len, strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        BEATS.rule
      );

      // caret appears with the first keystroke, rides the end of the typed text
      tl.fromTo(caret, { display: "none" }, { display: "inline-block", duration: 0 }, BEATS.rule + 0.38);
      var TYPE_START = BEATS.rule + 0.4;
      var TYPE_STEP = 0.085;
      for (var i = 0; i < chars.length; i++) {
        tl.fromTo(
          chars[i],
          { display: "none" },
          { display: "inline", duration: 0 },
          TYPE_START + i * TYPE_STEP
        );
      }
      // caret blink after typing (discrete sets — seek-safe, finite)
      var blinkFrom = TYPE_START + chars.length * TYPE_STEP + 0.12;
      var on = false;
      for (var t = blinkFrom; t < DURATION - 0.01; t += 0.26) {
        tl.set(caret, { opacity: on ? 1 : 0 }, t);
        on = !on;
      }

      // ── Scene 3 (3.25–4.8s): giant vermilion 4 slams over the smoke ──
      tl.fromTo(
        four,
        { scale: 2.6, y: -140, rotation: -16, opacity: 0, filter: "blur(10px)" },
        { scale: 1, y: 0, rotation: -6, opacity: 1, filter: "blur(0px)", duration: 0.38, ease: "expo.out" },
        BEATS.four
      );

      // camera kick on impact
      tl.set(cam, { x: 0, y: 0, scale: 1 }, 0);
      tl.to(
        cam,
        {
          keyframes: [
            { x: -16, y: 11, scale: 1.022, duration: 0.05, ease: "power2.out" },
            { x: 10, y: -7, scale: 1.014, duration: 0.06, ease: "power1.inOut" },
            { x: -5, y: 3, scale: 1.006, duration: 0.07, ease: "power1.inOut" },
            { x: 0, y: 0, scale: 1, duration: 0.14, ease: "power2.out" }
          ]
        },
        BEATS.four + 0.1
      );

      // 「年」 lands beside it a beat later — side snap with a heavy rise
      tl.fromTo(
        nian,
        { x: 90, y: 40, opacity: 0 },
        { x: 0, y: 0, opacity: 1, duration: 0.42, ease: "circ.out" },
        BEATS.nian
      );

      // subtle jitter on the 4 only, holding to the cut (fixed offsets — deterministic)
      var JIT = [
        [1.6, -1.0], [-1.2, 1.4], [0.8, 0.6], [-1.6, -0.8], [1.2, 1.2],
        [-0.6, -1.4], [1.4, 0.4], [-1.0, 1.0], [0.6, -0.6], [-1.4, 0.8],
        [1.0, -1.2], [-0.8, 0.4], [1.4, 1.0], [-1.2, -0.6], [0.4, 1.2]
      ];
      var jStart = BEATS.four + 0.42;
      var jStep = 0.07;
      for (var k = 0; k < JIT.length; k++) {
        var at = jStart + k * jStep;
        if (at + jStep > DURATION) break;
        tl.to(four, { x: JIT[k][0], y: JIT[k][1], duration: jStep, ease: "none" }, at);
      }

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
