  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 7.368;

      // ───────── Scene 1 (0.0–2.7s): light returns, audience rises, zoom to the reply, 「AI 驱动」 types ─────────
      tl.fromTo("#ai08-veil", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.out" }, 0);

      // ambient glow blooms behind the audience surface, landing with its settle
      tl.fromTo("#ai08-glow1", { opacity: 0, scale: 0.85 }, { opacity: 0.22, scale: 1, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo(
        "#ai08-win-rise",
        { opacity: 0, y: 70, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        0
      );
      tl.fromTo("#ai08-tag-audience", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.45);

      // zoom-to-target on An Lushan's reply bubble (nested wrappers: outer scales, inner counter-translates)
      // bubble centre in window space: (1218, 381) × 0.58333 = (710.5, 222.25); window centre (560, 315)
      const ZOOM1_S = 1.8;
      const ZOOM1_AT = 0.95;
      const ZOOM1_DUR = 1.2;
      tl.to("#ai08-zo1", { scale: ZOOM1_S, duration: ZOOM1_DUR, ease: "power3.inOut" }, ZOOM1_AT);
      tl.to("#ai08-zi1", { x: -150.5, y: 92.75, duration: ZOOM1_DUR, ease: "power3.inOut" }, ZOOM1_AT);

      // lacquer label panel snaps open, then 「AI 驱动」 types with a caret (discrete-text-sequence)
      tl.fromTo("#ai08-lab-panel", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, 0.5);
      const SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.7, text: "A" },
        { t: 0.8, text: "AI" },
        { t: 0.92, text: "AI " },
        { t: 1.12, text: "AI 驱" },
        { t: 1.34, text: "AI 驱动" },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      const textEl = document.getElementById("ai08-lab-text");
      const caretEl = document.getElementById("ai08-caret");
      const TYPE_TOTAL = 2.6;
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: TYPE_TOTAL,
          duration: TYPE_TOTAL,
          ease: "none",
          onUpdate: () => {
            textEl.textContent = textAt(driver.t);
          },
        },
        0
      );
      // caret blink: deterministic sin square wave, then the caret retires once the line has settled
      const BLINK_START = 0.5;
      const BLINK_DUR = 2.3;
      const BLINK_CYCLES = 3.5;
      const blink = { p: 0 };
      tl.fromTo(
        blink,
        { p: 0 },
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: BLINK_DUR,
          ease: "none",
          immediateRender: false,
          onUpdate: () => {
            caretEl.style.opacity = Math.cos(blink.p) > 0 ? "1" : "0";
          },
        },
        BLINK_START
      );
      tl.set(caretEl, { opacity: 0 }, 0);
      tl.set(caretEl, { opacity: 0 }, BLINK_START + BLINK_DUR);

      // ───────── Scene 2 (3.29–5.4s): audience yields left, three ministers' speech cards fan in ─────────
      const S2 = 3.29;
      // weight-transfer slide: the surface slides aside + scales down into the left column
      tl.to("#ai08-win-pos", { x: -16, y: 30, scale: 0.55, duration: 0.75, ease: "power3.inOut" }, S2);
      tl.to("#ai08-glow1", { opacity: 0.12, duration: 0.75, ease: "power2.inOut" }, S2);
      // the 「AI 驱动」 label docks under the shrunken surface
      tl.to("#ai08-lab-pos", { x: -1192, y: 238, scale: 0.62, duration: 0.75, ease: "power3.inOut" }, S2);

      tl.fromTo("#ai08-tag-debate", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.5);
      const cards = [
        { id: "#ai08-card1", rot: -4, at: 3.58 },
        { id: "#ai08-card2", rot: 0, at: 3.9 },
        { id: "#ai08-card3", rot: 4, at: 4.22 },
      ];
      cards.forEach((c) => {
        tl.fromTo(
          c.id,
          { opacity: 0, x: 280, y: 50, rotation: c.rot + 14, scale: 0.88 },
          { opacity: 1, x: 0, y: 0, rotation: c.rot, scale: 1, duration: 0.6, ease: "back.out(1.3)" },
          c.at
        );
      });

      tl.fromTo("#ai08-chip", { opacity: 0, y: 18, scaleX: 0.6 }, { opacity: 1, y: 0, scaleX: 1, duration: 0.4, ease: "power3.out" }, 4.7);

      // ───────── Scene 3 (5.57–7.368s): both surfaces clear, good ending blooms up, zoom to review card, ticks ─────────
      const S3 = 5.57;
      // zoom-through clear: Z-scale toward camera + blur + fade
      tl.to("#ai08-s12", { opacity: 0, scale: 1.07, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, S3);

      // ambient-glow-bloom behind the ending, landing with its settle (bloom-and-hold: short scene)
      tl.fromTo("#ai08-glow2", { opacity: 0, scale: 0.85 }, { opacity: 0.35, scale: 1, duration: 0.6, ease: "power2.out" }, S3);
      tl.fromTo(
        "#ai08-bloom",
        { opacity: 0, scale: 0.9, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" },
        S3 + 0.04
      );

      // gentle push (1.12×) that keeps BOTH the title card 「天宝中兴·夺镇弭兵」 and the review card's
      // three 「达成」 rows in frame above y 896. Nested wrappers: outer scales about centre, inner translates.
      // Translate kept inside ±(960/S − 960, 540/S − 540) so the image edge never shows.
      // Landed: title ≈ x 319–837, y ≈ 311; 达成 rows ≈ y 586–649; review card bottom ≈ y 803.
      const ZOOM2_S = 1.12;
      const ZOOM2_AT = 5.9;
      const ZOOM2_DUR = 1.0;
      tl.to("#ai08-zo2", { scale: ZOOM2_S, duration: ZOOM2_DUR, ease: "power2.inOut" }, ZOOM2_AT);
      tl.to("#ai08-zi2", { x: -100, y: -30, duration: ZOOM2_DUR, ease: "power2.inOut" }, ZOOM2_AT);

      // three 「达成」 rows: gold band sweeps, seal pops, tick draws — in sequence; last lands by ~6.9s
      [1, 2, 3].forEach((n, i) => {
        const at = 6.36 + i * 0.14;
        tl.fromTo("#ai08-band" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.out" }, at);
        tl.fromTo("#ai08-seal" + n, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, at);
        tl.fromTo("#ai08-tick" + n, { strokeDashoffset: 20 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, at + 0.08);
      });

      // hold to the end of the frame (no exit — the root transition owns it)
      tl.set({}, {}, DUR);

      window.__timelines["08-ai"] = tl;
    })();
  </script>
