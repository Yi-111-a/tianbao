      // ── Scene 6 (5.22–7.608): music drops — bad ending fades up, still; edges sink to black ──

      for (let i = 1; i <= steps; i++) {
        const t = SH_START + i * STEP;
        let a = 2.6 * Math.min(1, (t - SH_START) / 0.4);
        KICKS.forEach((k) => {
          if (t >= k) a += 10 * Math.exp(-(t - k) / 0.13);
        });
        tl.to(
          $("cam"),
          {
            x: hash(i) * a,
            y: hash(i + 71) * a * 0.6,
            rotation: hash(i + 13) * a * 0.02,
            duration: STEP,
            ease: "sine.inOut",
          },
          t - STEP,
        );
      }
      tl.to($("cam"), { x: 0, y: 0, rotation: 0, duration: 0.1, ease: "power2.out" }, SH_END);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
