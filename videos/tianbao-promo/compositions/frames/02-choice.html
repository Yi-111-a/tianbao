          w.el,
          { opacity: 0, y: 46, scale: last ? 1.6 : 1 },
          { opacity: 1, y: 0, scale: 1, duration: last ? 0.36 : 0.42, ease: last ? "back.out(2.2)" : "power3.out" },

        q("#choice-02-headline"),
        { y: 0, scale: 1, rotation: -2 },
        { y: -138, scale: 0.62, rotation: -2, duration: 0.75, ease: "power3.out" },

        q("#choice-02-left-cap"),
        { opacity: 0, y: 24, scale: 0.55, rotation: -2 },
        { opacity: 1, y: 0, scale: 1, rotation: -2, duration: 0.5, ease: "back.out(2)" },

        q("#choice-02-left-inner"),
        { y: 0 },
        { y: -6, duration: 1.2, ease: "sine.inOut" },
        2.1,
